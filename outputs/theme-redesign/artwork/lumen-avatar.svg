<path class="f-accent s-ink" stroke-width="1.1" transform="rotate(180 32 32)" d="M32 1.5L35.4 6 32 10.5 28.6 6Z"/>
<path class="f-accent s-ink" stroke-width="1.1" transform="rotate(270 32 32)" d="M32 1.5L35.4 6 32 10.5 28.6 6Z"/>
<path class="f-none s-shade" stroke-width="3.2" opacity=".6" d="M39.08 14.91L40.42 11.67 M49.09 24.92L52.33 23.58 M49.09 39.08L52.33 40.42 M39.08 49.09L40.42 52.33 M24.92 49.09L23.58 52.33 M14.91 39.08L11.67 40.42 M14.91 24.92L11.67 23.58 M24.92 14.91L23.58 11.67"/>
<path class="f-none s-glow" stroke-width="2" d="M39.08 14.91L40.42 11.67 M49.09 24.92L52.33 23.58 M49.09 39.08L52.33 40.42 M39.08 49.09L40.42 52.33 M24.92 49.09L23.58 52.33 M14.91 39.08L11.67 40.42 M14.91 24.92L11.67 23.58 M24.92 14.91L23.58 11.67"/>
<circle cx="32" cy="32" r="17" fill="url(#lumen-avatar-orb)"/>
<circle class="f-none s-shade" cx="32" cy="32" r="17" stroke-width="1.1"/>
<ellipse class="f-ink" cx="26.6" cy="30" rx="2.7" ry="3.6"/>
<ellipse class="f-ink" cx="37.4" cy="30" rx="2.7" ry="3.6"/>
<path class="f-none s-ink" stroke-width="2.1" d="M26 37Q32 42 38 37"/>
</svg>
