<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Espresso Leather ornaments: the necromancer's grimoire.

       Each symbol is a mask drawn in black; only opacity counts. Children
       marked data-ink="accent" are the gilt layer, painted with
       ornament-accent-ink; the rest is blind tooling, painted with
       ornament-ink. THEME-INTERFACE.md gives each symbol's rules.

       The geometry comes from the Espresso Leather timer seal in
       apps/web/src/components/timer/timer-dial.tsx: a square overlaid with
       a diamond inside two guide circles, and the twelve sigil markers
       (a diamond crossed by a bar) that become four-pointed sparks.

       Sources and licences: every symbol is hand-written for this project,
       except the book and flame in orn-vignette, adapted from Lucide's
       book-open and flame icons (ISC licence, Copyright (c) Lucide Icons
       and Contributors). -->

  <!-- Frame corner, top left: a heavy blind bracket over the frame's
       border, a short fillet over its keyline, and a quarter of the seal
       ring turning inside it, with a gilt diamond at the turn and a gilt
       stamp inside the ring. -->
  <symbol id="orn-corner" viewBox="0 0 24 24">
    <path d="M1.25 20V1.25H20" fill="none" stroke="#000" stroke-width="2.5"/>
    <path d="M6 14V6h8" fill="none" stroke="#000" stroke-width="1.1"/>
    <path d="M6 17.5A11.5 11.5 0 0 0 17.5 6" fill="none" stroke="#000" stroke-width=".9"/>
    <path data-ink="accent" d="M6 1 11 6 6 11 1 6ZM12.2 10.4 14 12.2 12.2 14 10.4 12.2Z"/>
  </symbol>

  <!-- Divider centre: a seal ring holding a diamond, with stubs that meet
       the divider's rules and a gilt pip on each. -->
  <symbol id="orn-divider" viewBox="0 0 32 16">
    <path d="M0 8h10M22 8h10" fill="none" stroke="#000" stroke-width=".9"/>
    <circle cx="16" cy="8" r="5.5" fill="none" stroke="#000" stroke-width=".9"/>
    <path data-ink="accent" d="M16 4.5 19.5 8 16 11.5 12.5 8ZM5.5 6.3 7.2 8 5.5 9.7 3.8 8ZM26.5 6.3 28.2 8 26.5 9.7 24.8 8Z"/>
  </symbol>

  <!-- Heading mark: the timer's sigil, a gilt diamond crossed by a bar. -->
  <symbol id="orn-heading" viewBox="0 0 16 16">
    <path d="M1.5 8h13M8 1v14" fill="none" stroke="#000" stroke-width="1.1"/>
    <path data-ink="accent" d="M8 3.5 11 8 8 12.5 5 8Z"/>
  </symbol>

  <!-- Band tile: a gilt roll of two fillets with a diamond and dots. The
       fillets run edge to edge and the dots are halved at the edges, so
       tiles join. -->
  <symbol id="orn-band" viewBox="0 0 16 6">
    <path d="M0 .5h16M0 5.5h16" fill="none" stroke="#000" stroke-width=".8"/>
    <circle cx="0" cy="3" r=".9"/>
    <circle cx="16" cy="3" r=".9"/>
    <path data-ink="accent" d="M8 1.2 9.8 3 8 4.8 6.2 3Z"/>
  </symbol>

  <!-- Emblem: the timer seal in miniature. Two guide circles, the square
       and diamond, four gilt cardinal pips and a spark at the centre. -->
  <symbol id="orn-emblem" viewBox="0 0 48 48">
    <g fill="none" stroke="#000">
      <circle cx="24" cy="24" r="21.5" stroke-width="1.2"/>
      <circle cx="24" cy="24" r="16" stroke-width=".7"/>
      <path d="M24 4.5 43.5 24 24 43.5 4.5 24Z" stroke-width=".9"/>
      <path d="M12.6 12.6h22.8v22.8H12.6Z" stroke-width=".9"/>
    </g>
    <path data-ink="accent" d="M24 .7 25.8 2.5 24 4.3 22.2 2.5ZM45.5 22.2 47.3 24 45.5 25.8 43.7 24ZM24 43.7 25.8 45.5 24 47.3 22.2 45.5ZM2.5 22.2 4.3 24 2.5 25.8 .7 24ZM24 18C24.6 22.2 25.8 23.4 30 24 25.8 24.6 24.6 25.8 24 30 23.4 25.8 22.2 24.6 18 24 22.2 23.4 23.4 22.2 24 18Z"/>
  </symbol>

  <!-- Appearance swatch: the seal over the leather inside a blind keyline
       with gilt corner pips. Strokes are heavy enough to read at 52 px, and
       the leather shows between them. -->
  <symbol id="orn-swatch" viewBox="0 0 64 64">
    <g fill="none" stroke="#000">
      <path d="M5 5h54v54H5Z" stroke-width="1.1"/>
      <circle cx="32" cy="32" r="21" stroke-width="2"/>
      <path d="M32 13 51 32 32 51 13 32Z" stroke-width="1.5"/>
      <path d="M21 21h22v22H21Z" stroke-width="1.5"/>
    </g>
    <path data-ink="accent" d="M5 2 8 5 5 8 2 5ZM59 2 62 5 59 8 56 5ZM5 56 8 59 5 62 2 59ZM59 56 62 59 59 62 56 59ZM32 25C32.7 29.8 34.2 31.3 39 32 34.2 32.7 32.7 34.2 32 39 31.3 34.2 29.8 32.7 25 32 29.8 31.3 31.3 29.8 32 25Z"/>
  </symbol>

  <!-- Portrait frame: a tooled double fillet in the outer 4% of the box,
       with gilt seals at the corners and sigils at each side's middle. The
       centre stays open for the construct. -->
  <symbol id="orn-portrait" viewBox="0 0 100 100">
    <g fill="none" stroke="#000">
      <path d="M.8 .8h98.4v98.4H.8Z" stroke-width="1.1"/>
      <path d="M3.2 3.2h93.6v93.6H3.2Z" stroke-width=".5"/>
    </g>
    <path data-ink="accent" fill-rule="evenodd" d="M2.4 0a2.4 2.4 0 1 1 0 4.8 2.4 2.4 0 1 1 0-4.8Zm0 1.2 1.2 1.2-1.2 1.2-1.2-1.2ZM97.6 0a2.4 2.4 0 1 1 0 4.8 2.4 2.4 0 1 1 0-4.8Zm0 1.2 1.2 1.2-1.2 1.2-1.2-1.2ZM2.4 95.2a2.4 2.4 0 1 1 0 4.8 2.4 2.4 0 1 1 0-4.8Zm0 1.2 1.2 1.2-1.2 1.2-1.2-1.2ZM97.6 95.2a2.4 2.4 0 1 1 0 4.8 2.4 2.4 0 1 1 0-4.8Zm0 1.2 1.2 1.2-1.2 1.2-1.2-1.2ZM50 0 52.4 2 50 4 47.6 2ZM98 47.6 100 50 98 52.4 96 50ZM50 96 52.4 98 50 100 47.6 98ZM2 47.6 4 50 2 52.4 0 50Z"/>
  </symbol>

  <!-- List marker: a four-pointed spark, the shape a passed timer marker
       takes. One ink. -->
  <symbol id="orn-bullet" viewBox="0 0 8 8">
    <path d="M4 0C4.4 2.6 5.4 3.6 8 4 5.4 4.4 4.4 5.4 4 8 3.6 5.4 2.6 4.4 0 4 2.6 3.6 3.6 2.6 4 0Z"/>
  </symbol>

  <!-- Empty-state vignette: an open grimoire with a rubricated first line
       on each page, and a lit candle. The emblem below it is the seal. Book and flame adapted
       from Lucide book-open and flame (ISC). -->
  <symbol id="orn-vignette" viewBox="0 0 120 64">
    <g transform="translate(0 -14)" fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(14 12) scale(2.75)" stroke-width=".55">
        <path d="M12 5v16"/>
        <path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/>
      </g>
      <path d="M28 31h11M24 36h15M24 41h15M24 46h15M24 51h11" stroke-width=".9"/>
      <path d="M59 31h11M55 36h15M55 41h15M55 46h15M55 51h9" stroke-width=".9"/>
      <path d="M86 72h22M90 72v-3h14v3M93 69V45h8v24M101 49c-1.2 0-1.2 4 0 4" stroke-width="1.1"/>
      <path d="M97 45v-3" stroke-width=".9"/>
    </g>
    <g data-ink="accent" transform="translate(0 -14)">
      <path d="M23.5 29h3v5h-3Z"/>
      <path d="M54.5 29h3v5h-3Z"/>
      <path d="M97 23.5v-3M88.5 27l-2-2M105.5 27l2-2" fill="none" stroke="#000" stroke-width=".9" stroke-linecap="round"/>
      <path transform="translate(90.4 28.6) scale(.55)" d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4Z"/>
    </g>
  </symbol>

  <!-- Notice mark: a small wax seal, set over the notice's top start
       corner. The ring is filled so the frame's border doesn't show
       through it. -->
  <symbol id="orn-notice" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="7" fill="none" stroke="#000" stroke-width="1.6"/>
    <path data-ink="accent" d="M8 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 1 1 0-13ZM8 4.2 4.2 8 8 11.8 11.8 8Z" fill-rule="evenodd"/>
  </symbol>

  <!-- Rule end, left: a gilt diamond and a tool stamp, then the fillet,
       which meets the rule at the right edge, at mid-height. The build
       mirrors it for the right end. -->
  <symbol id="orn-rule-end" viewBox="0 0 24 8">
    <path data-ink="accent" d="M.5 4 3.5 1 6.5 4 3.5 7Z"/>
    <circle cx="8.5" cy="4" r="1"/>
    <path d="M8.5 4H24" fill="none" stroke="#000" stroke-width=".9"/>
  </symbol>
</svg>
