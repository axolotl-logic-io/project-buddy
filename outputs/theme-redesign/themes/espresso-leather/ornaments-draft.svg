<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Espresso Leather ornament drafts: the necromancer's grimoire.

       Every symbol draws in currentColor only. When the build uses a symbol
       as a mask, currentColor resolves to opaque, so only opacity counts.
       Elements marked data-ink="accent" belong to the accent layer, painted
       with ornament-accent-ink; everything else is the main layer, painted
       with ornament-ink. No symbol names a colour.

       The geometry comes from the Espresso Leather timer seal in
       apps/web/src/components/timer/timer-dial.tsx: a square overlaid with
       a diamond (an eight-pointed seal), concentric guide circles, and the
       twelve sigil markers (a diamond crossed by a bar). Corners are blind
       and gilt tooling on a leather binding.

       Sources and licences:
       - All symbols are hand-written for this project, except
       - orn-vignette's book and flame, adapted from Lucide's "book-open"
         and "flame" icons (ISC licence, Copyright (c) Lucide Icons and
         Contributors; lucide-react is already a dependency). -->

  <!-- Heading mark: one of the timer's sigil markers, a diamond crossed by
       a bar. 16 x 16. -->
  <symbol id="orn-heading" viewBox="0 0 16 16">
    <path d="M1.5 8h13M8 1v14" fill="none" stroke="currentColor" stroke-width="1"/>
    <path data-ink="accent" fill="currentColor" d="M8 3.5 11 8 8 12.5 5 8Z"/>
  </symbol>

  <!-- Section divider centre: a seal ring holding a diamond, with stubs that
       meet the divider's rules and a pip on each. 32 x 16. -->
  <symbol id="orn-divider" viewBox="0 0 32 16">
    <path d="M0 8h10M22 8h10" fill="none" stroke="currentColor" stroke-width=".9"/>
    <circle cx="16" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width=".9"/>
    <path data-ink="accent" fill="currentColor"
      d="M16 4.5 19.5 8 16 11.5 12.5 8ZM5.5 6.3 7.2 8 5.5 9.7 3.8 8ZM26.5 6.3 28.2 8 26.5 9.7 24.8 8Z"/>
  </symbol>

  <!-- Frame corner, top left: a double fillet blind-tooled into the leather,
       a tool stamp, and a gilt diamond where the fillets turn. The build
       turns it for the other three corners. 24 x 24. -->
  <symbol id="orn-corner" viewBox="0 0 24 24">
    <path d="M1.5 24V1.5H24" fill="none" stroke="currentColor" stroke-width="1.25"/>
    <path d="M5.5 24V5.5H24" fill="none" stroke="currentColor" stroke-width=".6"/>
    <circle cx="11" cy="11" r="1.1" fill="currentColor"/>
    <path data-ink="accent" fill="currentColor" d="M5.5 1.5 9.5 5.5 5.5 9.5 1.5 5.5Z"/>
  </symbol>

  <!-- Rule end: the terminal of a free-standing rule, a fillet ending in a
       gilt diamond. Mirror it for the left end. 24 x 8. -->
  <symbol id="orn-rule-end" viewBox="0 0 24 8">
    <path d="M0 4h15.5" fill="none" stroke="currentColor" stroke-width=".9"/>
    <circle cx="15.5" cy="4" r="1" fill="currentColor"/>
    <path data-ink="accent" fill="currentColor" d="M17.5 4 20.5 1 23.5 4 20.5 7Z"/>
  </symbol>

  <!-- Band tile under the site header and trail band: a gilt roll, two
       hairline fillets with a diamond and dot pattern. It repeats across.
       16 x 6. -->
  <symbol id="orn-band" viewBox="0 0 16 6">
    <path d="M0 .5h16M0 5.5h16" fill="none" stroke="currentColor" stroke-width=".8"/>
    <circle cx="0" cy="3" r=".9" fill="currentColor"/>
    <circle cx="16" cy="3" r=".9" fill="currentColor"/>
    <path data-ink="accent" fill="currentColor" d="M8 1.2 9.8 3 8 4.8 6.2 3Z"/>
  </symbol>

  <!-- Emblem for an empty state and the sign-in card: the timer seal in
       miniature. Outer and inner guide circles, the square and diamond,
       four cardinal sigils and a spark at the centre. 48 x 48. -->
  <symbol id="orn-emblem" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor">
      <circle cx="24" cy="24" r="22.5" stroke-width="1.1"/>
      <circle cx="24" cy="24" r="16.5" stroke-width=".6"/>
      <path d="M24 3.4 44.6 24 24 44.6 3.4 24Z" stroke-width=".8"/>
      <path d="M12.1 12.1h23.8v23.8H12.1Z" stroke-width=".8"/>
    </g>
    <path data-ink="accent" fill="currentColor"
      d="M24 -.2 25.8 1.5 24 3.2 22.2 1.5ZM46.5 22.2 48.2 24 46.5 25.8 44.8 24ZM24 44.8 25.8 46.5 24 48.2 22.2 46.5ZM1.5 22.2 3.2 24 1.5 25.8 -.2 24ZM24 18.5C24.5 22 26 23.5 29.5 24 26 24.5 24.5 26 24 29.5 23.5 26 22 24.5 18.5 24 22 23.5 23.5 22 24 18.5Z"/>
  </symbol>

  <!-- Appearance swatch: the seal over the leather swatch, inside a blind
       keyline with gilt corner pips. Bold enough to read at 52 px.
       64 x 64. -->
  <symbol id="orn-swatch" viewBox="0 0 64 64">
    <g fill="none" stroke="currentColor">
      <path d="M5 5h54v54H5Z" stroke-width="1.1"/>
      <circle cx="32" cy="32" r="21" stroke-width="2"/>
      <path d="M32 13 51 32 32 51 13 32Z" stroke-width="1.5"/>
      <path d="M21 21h22v22H21Z" stroke-width="1.5"/>
    </g>
    <path data-ink="accent" fill="currentColor"
      d="M5 2 8 5 5 8 2 5ZM59 2 62 5 59 8 56 5ZM5 56 8 59 5 62 2 59ZM59 56 62 59 59 62 56 59ZM32 25C32.7 29.8 34.2 31.3 39 32 34.2 32.7 32.7 34.2 32 39 31.3 34.2 29.8 32.7 25 32 29.8 31.3 31.3 29.8 32 25Z"/>
  </symbol>

  <!-- Construct portrait frame: a tooled double fillet around the
       portrait, gilt seals at the corners and sigils at each side's middle.
       The centre stays open. The component stretches it to the portrait's
       square box. 100 x 100. -->
  <symbol id="orn-portrait" viewBox="0 0 100 100">
    <g fill="none" stroke="currentColor">
      <path d="M1 1h98v98H1Z" stroke-width="1.2"/>
      <path d="M4 4h92v92H4Z" stroke-width=".5"/>
    </g>
    <path data-ink="accent" fill="currentColor" fill-rule="evenodd"
      d="M4 0a4 4 0 1 1 0 8 4 4 0 1 1 0-8Zm0 2 2 2-2 2-2-2ZM96 0a4 4 0 1 1 0 8 4 4 0 1 1 0-8Zm0 2 2 2-2 2-2-2ZM4 92a4 4 0 1 1 0 8 4 4 0 1 1 0-8Zm0 2 2 2-2 2-2-2ZM96 92a4 4 0 1 1 0 8 4 4 0 1 1 0-8Zm0 2 2 2-2 2-2-2ZM50 -.5 53 2.5 50 5.5 47 2.5ZM97.5 47 100.5 50 97.5 53 94.5 50ZM50 94.5 53 97.5 50 100.5 47 97.5ZM2.5 47 5.5 50 2.5 53 -.5 50Z"/>
  </symbol>

  <!-- Empty-state vignette: an open grimoire with a seal on its right
       page, and a lit candle. Book and flame adapted from Lucide
       "book-open" and "flame" (ISC). 120 x 80. -->
  <symbol id="orn-vignette" viewBox="0 0 120 80">
    <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(14 12) scale(2.75)" stroke-width=".55">
        <path d="M12 5v16"/>
        <path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/>
      </g>
      <path d="M27 31h12M24 36h15M24 41h15M24 46h15M24 51h11" stroke-width=".9"/>
      <circle cx="61" cy="41" r="7" stroke-width="1"/>
      <path d="M61 35.5 66.5 41 61 46.5 55.5 41Z" stroke-width=".8"/>
      <path d="M86 72h22M90 72v-3h14v3M93 69V45h8v24M101 49c-1.2 0-1.2 4 0 4" stroke-width="1.1"/>
      <path d="M97 45v-3" stroke-width=".9"/>
    </g>
    <g data-ink="accent" fill="currentColor">
      <path d="M23.5 29h3v5h-3Z"/>
      <circle cx="61" cy="41" r="1.6"/>
      <path d="M97 23.5v-3M88.5 27l-2-2M105.5 27l2-2" stroke="currentColor" stroke-width=".9" stroke-linecap="round"/>
      <path transform="translate(90.4 28.6) scale(.55)"
        d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4Z"/>
    </g>
  </symbol>

  <!-- Notice mark: a small wax seal for a notice or form error, beside
       the notice's text. 16 x 16. -->
  <symbol id="orn-notice" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="6.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
    <path data-ink="accent" fill="currentColor" d="M8 4.2 11.8 8 8 11.8 4.2 8Z"/>
  </symbol>

  <!-- List marker: a four-pointed spark, the shape a passed timer marker
       takes. 8 x 8. -->
  <symbol id="orn-bullet" viewBox="0 0 8 8">
    <path fill="currentColor" d="M4 0C4.4 2.6 5.4 3.6 8 4 5.4 4.4 4.4 5.4 4 8 3.6 5.4 2.6 4.4 0 4 2.6 3.6 3.6 2.6 4 0Z"/>
  </symbol>
</svg>
