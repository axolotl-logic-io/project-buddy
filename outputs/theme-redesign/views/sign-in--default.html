<div class="app">
<header class="site-header">
  <a class="hud-title" href="quests--list.html">
    <span class="hud-medallion" aria-hidden="true"><svg class="icon"><use href="#i-compass"/></svg></span>
    <span class="hud-name">Project Buddy</span>
  </a>
  
</header>

<main class="page">
  <div class="page-centre">
    <section class="card" data-frame="feature" style="inline-size:min(100%,26rem)" aria-labelledby="sign-in-title">
      <span class="ornament" data-ornament="emblem" aria-hidden="true" style="align-self:center"></span>
      <h1 class="site-title" id="sign-in-title">Project Buddy</h1>
      <div class="divider"><span class="ornament" data-ornament="divider" aria-hidden="true"></span></div>
      <p class="lede lede-initial">Enter your email address to log in or sign up. We'll email you a link to continue.</p>
      <form class="form-stack">
        <div class="field">
          <label class="field-label" for="email">Email address</label>
          <input class="input-field" id="email" type="email" autocomplete="email" value="mara@example.com">
        </div>
        <button class="button-primary" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>Email me a link</button>
        <p class="form-status" role="status"></p>
      </form>
      <p class="muted">New here? <a class="text-link" href="#">Sign up</a></p>
      
    </section>
  </div>
</main>


</div>
