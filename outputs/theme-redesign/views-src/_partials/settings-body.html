<main class="page">
  <div class="page-column">
    <section class="panel settings-section" aria-labelledby="settings-appearance">
      <h2 class="section-heading" id="settings-appearance"><span class="ornament" data-ornament="heading" aria-hidden="true"></span>Appearance</h2>
      <!-- include:swatches name="settings-theme" size="large" focus="{{focus}}" hover="{{hover}}" -->
    </section>
    <section class="panel settings-section" aria-labelledby="settings-security">
      <h2 class="section-heading" id="settings-security"><span class="ornament" data-ornament="heading" aria-hidden="true"></span>Security</h2>
      <p><button class="button-secondary" type="button"><svg class="icon" aria-hidden="true"><use href="#i-log-out"/></svg>Sign out</button></p>
      <div class="rule" role="presentation"></div>
      <p class="muted">This signs you out in every browser and on every device, this one included. Sign-in links and quest invitation links already sent stop working. Your invitations stay in Pending, and you can sign in again with a new link.</p>
      <p><button class="button-danger" type="button">Sign out everywhere</button></p>
    </section>
  </div>
</main>
