<header class="site-header">
  <a class="hud-title" href="quests--list.html">
    <span class="hud-medallion" aria-hidden="true"><svg class="icon"><use href="#i-compass"/></svg></span>
    <span class="hud-name">Project Buddy</span>
  </a>
  {{?circle}}<div class="site-header-tools">
    <a class="progress-ring" href="profile--experience.html" aria-label="Circle {{circle}} · Initiate: 4 more experience to reach circle 5. Open your experience.">
      <svg class="progress-ring-svg" viewBox="0 0 40 40" aria-hidden="true">
        <circle class="progress-ring-disc" cx="20" cy="20" r="18"/>
        <circle class="progress-ring-track" cx="20" cy="20" r="16" pathLength="100"/>
        <circle class="progress-ring-arc" cx="20" cy="20" r="16" pathLength="100" stroke-dasharray="60 100"/>
      </svg>
      <span class="progress-ring-label" aria-hidden="true">{{circle}}</span>
    </a>
  </div>{{/?}}
</header>
