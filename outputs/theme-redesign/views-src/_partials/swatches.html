<fieldset class="appearance-fieldset">
  <legend class="panel-label">Theme</legend>
  <div class="appearance-swatches">
    <label class="appearance-swatch" data-size="{{size}}">
      <input class="appearance-swatch-input" type="radio" name="{{name}}" value="light" aria-label="Ivory Vellum"{{?checked=light}} checked{{/?}}{{?focus=light}} data-force="focus"{{/?}}>
      <span class="appearance-swatch-face" data-mode="light" aria-hidden="true"></span>
      <span class="appearance-swatch-tooltip" aria-hidden="true">Ivory Vellum</span>
    </label>
    <label class="appearance-swatch" data-size="{{size}}">
      <input class="appearance-swatch-input" type="radio" name="{{name}}" value="soot-brass" aria-label="Soot &amp; Brass"{{?checked=soot-brass}} checked{{/?}}{{?focus=soot-brass}} data-force="focus"{{/?}}>
      <span class="appearance-swatch-face" data-mode="soot-brass" aria-hidden="true"></span>
      <span class="appearance-swatch-tooltip" aria-hidden="true">Soot &amp; Brass</span>
    </label>
    <label class="appearance-swatch" data-size="{{size}}">
      <input class="appearance-swatch-input" type="radio" name="{{name}}" value="dark" aria-label="Espresso Leather"{{?checked=dark}} checked{{/?}}{{?focus=dark}} data-force="focus"{{/?}}>
      <span class="appearance-swatch-face" data-mode="dark" aria-hidden="true"></span>
      <span class="appearance-swatch-tooltip" aria-hidden="true">Espresso Leather</span>
    </label>
  </div>
</fieldset>
