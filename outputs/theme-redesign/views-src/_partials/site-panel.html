    <h2 id="site-panel-title">Site panel</h2>
  </div>

    <ul class="panel-links" aria-labelledby="site-panel-you">
      <li><a class="panel-link" href="profile--experience.html"{{?current=profile}} aria-current="page"{{/?}}>Profile</a></li>
      <li><a class="panel-link" href="settings--default.html"{{?current=settings}} aria-current="page"{{/?}}>Settings</a></li>
    </ul>

  <div class="divider"><span class="ornament" data-ornament="divider" aria-hidden="true"></span></div>
