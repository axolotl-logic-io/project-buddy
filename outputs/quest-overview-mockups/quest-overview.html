/* Parchment, sepia ink and burnished gold, inspired by an engraved map. */
@layer parchment {
  /* next/font sets these on <html> (theme-fonts.ts); these are the fallbacks
     until it does. */
  :root {
    --typeface-im-fell-english: Georgia, serif;
    --typeface-im-fell-english-italic: Georgia, serif;
    --typeface-cormorant-garamond: Georgia, serif;
    --typeface-unifrakturmaguntia: Georgia, serif;
    --typeface-source-serif-4: Georgia, "Times New Roman", serif;
    --typeface-nunito: ui-rounded, system-ui, sans-serif;
    --typeface-jetbrains-mono: ui-monospace, monospace;
  }

  [data-theme="parchment"] {
    /* Timer illustrations share the site's material and follow its appearance. */
    --timer-body-font: var(--typeface-im-fell-english);
    --timer-phase-font: var(--typeface-im-fell-english-italic);
    --timer-numeral-font: var(--typeface-cormorant-garamond);
    --timer-blackletter-font: var(--typeface-unifrakturmaguntia);
    --timer-phase-size: 2rem;
    --timer-numeral-size: 7.25rem;
    --timer-number-scale: max(4.25rem, 26cqi);
    --timer-hours-scale: 23cqi;
    --timer-number-leading: 1;
    --timer-next-font: var(--timer-body-font);
    --timer-hourglass-display: block;
    --timer-ring-display: none;
    --timer-face-columns: 1fr 1.12fr;
    --timer-face-width: 100%;
    --timer-face-ratio: auto;
    --timer-face-height: 35.625rem;
    --timer-stage-padding: 1.5rem 4rem;
    --timer-face-padding: 2.5rem 3.4375rem;

    --timer-next-offset: auto;

    --soot-brass-construct-ground: rgb(60 29 36);
    --soot-brass-construct-ground-ink: rgb(160 116 108);
    --soot-brass-construct-ink: rgb(28 19 21);
    --soot-brass-construct-metal: rgb(200 174 120);
    --soot-brass-construct-metal-shade: rgb(128 104 68);
    --soot-brass-construct-metal-light: rgb(238 224 186);
    --soot-brass-construct-paper: rgb(230 219 196);
    --soot-brass-construct-glow: rgb(234 200 132);
    --soot-brass-construct-glow-core: rgb(255 247 226);
    --soot-brass-construct-accent: rgb(158 40 46);

    --light-action-fill: rgb(128 80 20);
    --light-on-action: rgb(255 246 226);
    --light-action-paper: rgb(255 248 230);
    --light-action-ink: rgb(52 32 18);
    --soot-brass-action-fill: rgb(208 180 122);
    --soot-brass-on-action: rgb(38 30 20);
    --soot-brass-action-paper: rgb(37 29 32);
    --soot-brass-action-ink: rgb(238 228 210);
    --dark-action-fill: rgb(234 190 112);
    --dark-on-action: rgb(42 27 14);
    --dark-action-paper: rgb(46 33 23);
    --dark-action-ink: rgb(246 228 192);

    --body-font: var(--typeface-nunito);
    --heading-font: var(--typeface-source-serif-4);
    --display-font: var(--typeface-im-fell-english);
    --display-weight: 400;
    --display-tracking: 0.01em;
    --mono-font: var(--typeface-jetbrains-mono);
    --conversation-font: var(--typeface-source-serif-4);
    --conversation-text-size: 1.0625rem;
    --conversation-leading: 1.55;
    --conversation-field-radius: 0.125rem;

    /* Tailwind's own unit, as the site had before themes. */
    --space-unit: 0.25rem;
    /* Letterpress actions are distinct from rounded fields/content panels. */
    --action-radius: 2px;
    --action-line-width: 1px;
    --action-font: var(--typeface-source-serif-4);
    --action-hover-shadow: 0 2px 5px
      color-mix(in srgb, var(--pb-shadow) 18%, transparent);
    --action-pressed-shadow: inset 0 1px 2px
      color-mix(in srgb, var(--pb-shadow) 20%, transparent);
    --control-radius: 0.625rem;
    --box-radius: 1rem;
    --line-width: 2px;
    --control-shadow: 0 2px 0
      color-mix(in oklab, var(--pb-shadow) 22%, transparent);
    --raised-shadow:
      0 10px 28px -8px color-mix(in oklab, var(--pb-shadow) 35%, transparent),
      0 2px 6px color-mix(in oklab, var(--pb-shadow) 15%, transparent);
    --focus-glow: 0 0 transparent;

    /* Tailwind's text-4xl and text-5xl, text-3xl and text-xl, and for the
       header's and a card's titles text-xl and text-lg, as the site had
       before themes. A page's heading steps down to text-2xl on a phone,
       so a long title leaves room for the page below it. */
    --site-title-size: 2.25rem;
    --site-title-wide-size: 3rem;
    --page-heading-size: 1.875rem;
    --page-heading-phone-size: 1.5rem;
    --section-heading-size: 1.25rem;
    --header-title-size: 1.25rem;
    --card-title-size: 1.125rem;

    /* The fixed page image also aligns with the conversation composer. */
    --panel-decoration: linear-gradient(
      110deg,
      transparent,
      color-mix(in oklab, var(--pb-primary) 5%, transparent)
    );
    --panel-label-case: none;
    --panel-label-tracking: 0.04em;
    --panel-separator: linear-gradient(
      to right,
      transparent,
      var(--pb-line),
      transparent
    );
    --panel-separator-size: 1px;
  }
  /* The compact hourglass stacks above its readout on a narrow page. */
  @media (width <= 28.75rem) {
    [data-theme="parchment"] {
      --timer-face-columns: 1fr;
      --timer-face-height: 32.5rem;
      --timer-face-padding: 2.5rem 1.5rem;
      --timer-readout-align: center;
      --timer-phase-size: 1.5625rem;
      --timer-numeral-size: 4.25rem;
      --timer-phase-gap: 0.3125rem;
      --timer-next-margin: 1.125rem;
      --timer-next-padding: 0.75rem;
    }
  }

  /* Keep the complete readout visible below the header on short phones. */
  @media (width <= 28.75rem) and (height <= 42rem) {
    [data-theme="parchment"] {
      --timer-face-height: auto;
      --timer-face-padding: 0 1.5rem;
      --timer-stage-padding: 0;
      --timer-next-margin: 0.75rem;
      --timer-next-padding: 0.5rem;
    }
  }

  [data-mode="soot-brass"],
  [data-mode="dark"] {
    --timer-hourglass-display: none;
    --timer-ring-display: block;
    --timer-face-columns: 1fr;
    --timer-face-width: min(100%, 30rem);
    --timer-face-ratio: 1;
    --timer-face-height: auto;
    --timer-stage-padding: 1.5rem 4rem;
    --timer-face-padding: 0;
    --timer-readout-align: center;
    --timer-phase-position: absolute;
    --timer-phase-size: 1.75rem;
    --timer-numeral-size: 6rem;
    --timer-number-scale: 26cqi;
    --timer-hours-scale: 16cqi;
    --timer-number-leading: 1.1;
    --timer-next-font: var(--heading-font);
    --timer-phase-gap: 0;
    --timer-next-position: absolute;
    --timer-next-offset: calc(100% + 1.25rem);
    --timer-next-margin: 0;
    --timer-next-padding: 0;
    --timer-next-rule: none;
  }

  [data-mode="soot-brass"] {
    --body-font: var(--typeface-source-serif-4);
    --control-radius: 2px;
    --box-radius: 3px;
    --line-width: 1px;

    --timer-marker-active: var(--pb-foreground);
    --timer-phase-font: var(--heading-font);
    --timer-radius: 164px;
    --timer-stroke: 12px;
    --timer-hatch-opacity: 0.16;
    --timer-guide-outer: 186px;
    --timer-guide-middle: 176px;
    --timer-guide-inner: 151px;
    --timer-chapter-display: block;

    /* Display, frame and ornament roles. */
    --label-font: var(--typeface-source-serif-4);
    --label-ink: var(--pb-muted);
    --label-case: none;
    --label-caps: all-small-caps;
    --label-tracking: 0.06em;
    --numeral-font: var(--typeface-source-serif-4);
    --initial-font: var(--typeface-cormorant-garamond);
    --initial-size: 1.6em;
    --initial-float: none;
    --rubric: rgb(226 196 132);
    --ornament-ink: rgb(170 145 98);
    --ornament-accent-ink: var(--rubric);
    --rule-ink: var(--pb-line);
    --frame-ink: var(--pb-line);
    --scrim: color-mix(in oklab, var(--pb-shadow) 62%, transparent);
    --rule-style: solid;
    --rule-width: 1px;
    --frame-style: solid;
    --frame-width: 1px;
    --frame-radius: 3px;
    --frame-inset: 3px;
    --frame-keyline: 1px;
    --header-decoration: linear-gradient(
      to bottom,
      color-mix(in oklab, var(--pb-header-gold) 6%, transparent),
      transparent
    );
    --trail-decoration: linear-gradient(
      to bottom,
      color-mix(in oklab, var(--pb-primary) 6%, transparent),
      transparent 70%
    );
    --frame-decoration: linear-gradient(
      to bottom,
      color-mix(in oklab, var(--pb-primary) 4%, transparent),
      transparent 9rem
    );
    --ring-track: color-mix(in oklab, var(--pb-line) 35%, transparent);
    --ring-arc: var(--pb-primary);
    --ring-disc: var(--pb-surface);
    --ring-ink: var(--pb-foreground);
    --ring-stroke: 0.09;
    --orn-corner-size: 1.5rem;
    --orn-corner-panel-size: 1.5rem;
    --orn-corner-dialog-size: 1.5rem;
    --orn-corner-feature-size: 1.75rem;
    --orn-corner-card-size: 0px;
    --orn-divider-width: 2.75rem;
    --orn-heading-width: 1rem;
    --orn-band-height: 0.5rem;
    --orn-emblem-size: 3.5rem;
    --orn-portrait-bleed: 0.75rem;
    --orn-bullet-size: 0.4375rem;
    --orn-vignette-width: 8rem;
    --orn-notice-size: 1rem;
    --orn-rule-end-height: 0.5rem;
  }

  [data-mode="dark"] {
    --body-font: var(--typeface-source-serif-4);
    --control-radius: 3px;
    --box-radius: 4px;
    --line-width: 2px;

    --timer-marker-active: var(--pb-foreground);
    --timer-phase-font: var(--timer-blackletter-font);
    --timer-phase-size: 2rem;
    --timer-radius: 162px;
    --timer-stroke: 12px;
    --timer-guide-outer: 186px;
    --timer-guide-middle: 0px;
    --timer-guide-inner: 136px;
    --timer-inscription-display: block;
    --timer-sigil-display: block;
    --timer-seal-display: block;

    /* Display, frame and ornament roles. */
    --label-font: var(--typeface-source-serif-4);
    --label-ink: var(--pb-muted);
    --label-case: uppercase;
    --label-caps: normal;
    --label-tracking: 0.08em;
    --numeral-font: var(--typeface-cormorant-garamond);
    --initial-font: var(--typeface-unifrakturmaguntia);
    --initial-size: 1.75em;
    --initial-float: none;
    --rubric: rgb(246 152 104);
    --ornament-ink: var(--pb-line);
    --ornament-accent-ink: var(--pb-primary);
    --rule-ink: var(--pb-line);
    --frame-ink: var(--pb-line);
    --scrim: color-mix(in oklab, var(--pb-shadow) 62%, transparent);
    --rule-style: solid;
    --rule-width: 1px;
    --frame-style: solid;
    --frame-width: 1px;
    --frame-radius: 0.25rem;
    --frame-inset: 0.25rem;
    --frame-keyline: 1px;
    --header-decoration: none;
    --trail-decoration: linear-gradient(
      to bottom,
      color-mix(in oklab, var(--pb-primary) 5%, transparent),
      transparent
    );
    --frame-decoration: radial-gradient(
      ellipse 90% 60% at 50% 0%,
      color-mix(in oklab, var(--pb-primary) 6%, transparent),
      transparent
    );
    --ring-track: color-mix(in oklab, var(--pb-line) 35%, transparent);
    --ring-arc: var(--pb-primary);
    --ring-disc: var(--pb-surface);
    --ring-ink: var(--pb-foreground);
    --ring-stroke: 0.1;
    --orn-corner-size: 1.25rem;
    --orn-corner-panel-size: var(--orn-corner-size);
    --orn-corner-dialog-size: var(--orn-corner-size);
    --orn-corner-feature-size: 1.5rem;
    --orn-corner-card-size: 0px;
    --orn-divider-width: 2.5rem;
    --orn-heading-width: 1rem;
    --orn-band-height: 0.5rem;
    --orn-emblem-size: 3.5rem;
    --orn-portrait-bleed: 0.75rem;
    --orn-bullet-size: 0.5rem;
    --orn-vignette-width: 8.5rem;
    --orn-notice-size: 1.125rem;
    --orn-rule-end-height: 0.5rem;
  }

  /* Display, frame and ornament roles for the shared components. */
  :root:not([data-mode]),
  [data-mode="light"] {
    --control-radius: 3px;
    --box-radius: 3px;
    --line-width: 1px;

    --label-font: var(--heading-font);
    --label-ink: var(--rubric);
    --label-case: none;
    --label-caps: all-small-caps;
    --label-tracking: 0.08em;
    --numeral-font: var(--typeface-cormorant-garamond);
    --initial-font: var(--typeface-im-fell-english);
    --initial-size: 1.75em;
    --initial-float: none;
    --rubric: rgb(150 50 32);
    --ornament-ink: var(--pb-line);
    --ornament-accent-ink: rgb(171 126 47);
    --rule-ink: var(--pb-line);
    --frame-ink: var(--pb-line);
    --scrim: color-mix(in oklab, var(--pb-shadow) 42%, transparent);
    --rule-style: solid;
    --rule-width: 1px;
    --frame-style: solid;
    --frame-width: 1px;
    --frame-radius: 2px;
    --frame-inset: 3px;
    --frame-keyline: 1px;
    --header-decoration: linear-gradient(
      to top,
      transparent 0 4px,
      color-mix(in srgb, var(--pb-header-gold) 60%, transparent) 4px 5px,
      transparent 5px
    );
    --trail-decoration: none;
    --frame-decoration: none;
    --ring-track: color-mix(in oklab, var(--pb-line) 35%, transparent);
    --ring-arc: var(--pb-primary);
    --ring-disc: var(--pb-surface);
    --ring-ink: var(--pb-foreground);
    --ring-stroke: 0.09;
    --orn-corner-size: 1.125rem;
    --orn-corner-panel-size: var(--orn-corner-size);
    --orn-corner-dialog-size: 1.25rem;
    --orn-corner-feature-size: 1.375rem;
    --orn-corner-card-size: 0px;
    --orn-divider-width: 2rem;
    --orn-heading-width: 0.9375rem;
    --orn-band-height: 0.5rem;
    --orn-emblem-size: 3.5rem;
    --orn-portrait-bleed: 0.625rem;
    --orn-bullet-size: 0.4375rem;
    --orn-vignette-width: 8.5rem;
    --orn-notice-size: 1rem;
    --orn-rule-end-height: 0.5rem;
  }
}

@layer mockup {
/* Construct artwork: the paint roles of the built-in SVG portraits.

   The drawings in lumen.svg, vellum.svg and their avatar cuts name no
   colour. Every shape carries a fill class (f-*) and a stroke class (s-*),
   and this file maps those classes to the construct paint roles below.

   An appearance sets the --construct-* roles. Each role falls back to an
   existing contract token, so the art renders in any appearance that sets
   nothing new. The fallbacks resolve on the drawing's own root element,
   so an appearance swatch or a specimen panel with its own data-mode gets
   its own values. */

.construct-art {
  /* The portrait's backdrop: vellum, night or leather. */
  --ca-ground: var(--construct-ground, var(--pb-field, transparent));
  /* Faint backdrop detail: map coastlines, routes, motes. */
  --ca-ground-ink: var(--construct-ground-ink, var(--pb-line, currentColor));
  /* Outlines and line work. Drawn over metal, paper or light only. */
  --ca-ink: var(--construct-ink, var(--pb-header-ink, currentColor));
  /* The lit face of brass: Vellum's body, Lumen's rune ring. */
  --ca-metal: var(--construct-metal, var(--pb-header-gold, currentColor));
  /* The shadowed face of brass: bands, joints, gears. */
  --ca-metal-shade: var(
    --construct-metal-shade,
    color-mix(in oklab, var(--ca-metal) 58%, var(--ca-ink))
  );
  /* Polish highlights on brass. */
  --ca-metal-light: var(
    --construct-metal-light,
    color-mix(in oklab, var(--ca-metal) 45%, var(--ca-paper))
  );
  /* Map paper, the quill's vane, the compass plate. */
  --ca-paper: var(--construct-paper, var(--pb-header-paper, currentColor));
  /* Lumen's light and Vellum's lenses. */
  --ca-glow: var(--construct-glow, var(--ca-metal));
  /* The hottest centre of a light. */
  --ca-glow-core: var(--construct-glow-core, var(--ca-paper));
  /* One rubric accent: jewels, the compass's north, the map's ribbon. */
  --ca-accent: var(--construct-accent, var(--rubric, var(--pb-accent, currentColor)));

  display: block;
  inline-size: 100%;
  block-size: 100%;
}

.construct-art .f-none { fill: none; }
.construct-art .f-ground { fill: var(--ca-ground); }
.construct-art .f-ground-ink { fill: var(--ca-ground-ink); }
.construct-art .f-ink { fill: var(--ca-ink); }
.construct-art .f-metal { fill: var(--ca-metal); }
.construct-art .f-shade { fill: var(--ca-metal-shade); }
.construct-art .f-light { fill: var(--ca-metal-light); }
.construct-art .f-paper { fill: var(--ca-paper); }
.construct-art .f-glow { fill: var(--ca-glow); }
.construct-art .f-core { fill: var(--ca-glow-core); }
.construct-art .f-accent { fill: var(--ca-accent); }

.construct-art [class*="s-"] {
  stroke-linecap: round;
  stroke-linejoin: round;
}
.construct-art .s-ink { stroke: var(--ca-ink); }
.construct-art .s-ground-ink { stroke: var(--ca-ground-ink); }
.construct-art .s-metal { stroke: var(--ca-metal); }
.construct-art .s-shade { stroke: var(--ca-metal-shade); }
.construct-art .s-light { stroke: var(--ca-metal-light); }
.construct-art .s-paper { stroke: var(--ca-paper); }
.construct-art .s-glow { stroke: var(--ca-glow); }
.construct-art .s-core { stroke: var(--ca-glow-core); }
.construct-art .s-accent { stroke: var(--ca-accent); }

.construct-art .st-ground { stop-color: var(--ca-ground); }
.construct-art .st-ground-edge {
  stop-color: color-mix(in oklab, var(--ca-ground) 84%, var(--ca-ink));
}
.construct-art .st-glow { stop-color: var(--ca-glow); }
.construct-art .st-core { stop-color: var(--ca-glow-core); }

/* Fine detail (hatching, motes, map margins, rune ticks) drops out when
   the portrait is drawn small. The nearest size container is the
   construct frame (.construct-visual, container-type: inline-size). */
@container (max-width: 96px) {
  .construct-art .fine { display: none; }
}

  * { box-sizing: border-box }
  body { margin: 0 }
  .workspace { color: var(--pb-foreground); font: 15px/1.45 var(--body-font); min-inline-size: 0; background: var(--pb-background) var(--pb-page-decoration) center top / 680px auto; min-block-size: 720px }
  button, input, select { font: inherit; color: inherit; min-inline-size: 0 }
  button, summary { cursor: pointer }
  .workspace :focus-visible { outline: 2px solid var(--pb-focus) !important; outline-offset: 3px }
  .workspace #page-title:focus { outline: none !important }
  [hidden] { display: none !important }
  h1, h2, h3, p, ul, ol { margin: 0 }

<script>
const $ = (selector) => document.querySelector(selector);
const sectionNames = {
  overview: "Overview", tasks: "Tasks", ideas: "Ideas", notes: "Quick Notes",
  progress: "Progress", spells: "Spells & status", members: "Members", days: "Day grid",
};
const paths = {

  ideas: "M5.5 12h5m-4 2h3M5.5 10C5.5 9 4 8 4 6a4 4 0 0 1 8 0c0 2-1.5 3-1.5 4",
  notes: "M3 2h10v12H3ZM5.5 5h5m-5 3h5m-5 3h3",
  progress: "M3.5 14V2.5M3.5 3H12l-2.25 3L12 9H3.5",
  spells: "M2.5 13.5l7-7 2 2-7 7Zm8-11 1-1m2 4h2m-3 4 1 1m-6-6v-2",
  members: "M3 14v-2a3 3 0 0 1 3-3h2a3 3 0 0 1 3 3v2m0-5a3 3 0 0 1 3 3v2M9.5 5.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0ZM11 3a2.5 2.5 0 0 1 0 5",
  timer: "M4 2h8M4 14h8M5 2v2c0 2 3 3 3 4s-3 2-3 4v2m6-12v2c0 2-3 3-3 4s3 2 3 4v2",
  next: "m6 4 4 4-4 4",
  back: "M13 8H3m4-4L3 8l4 4",
  check: "m3 8 3 3 7-7",
  reopen: "M6 3 3 6l3 3M3 6h6a4 4 0 0 1 0 8",
  more: "M3 8h.01M8 8h.01M13 8h.01",
  days: "M2.5 4h11v10h-11Zm0 3h11M5 2v4m6-4v4M5 10h1m2 0h1m2 0h1",
};

function icon(name, extra = "") {
  return `<svg class="icon ${extra}" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="${paths[name]}"/></svg>`;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  })[char]);
}

function dateKey(offset = 0) {
  const date = new Date();
  date.setDate(date.getDate() + offset);
  return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, "0"), String(date.getDate()).padStart(2, "0")].join("-");
}

function dateLabel(date, options = { month: "short", day: "numeric" }) {
  return new Date(date + "T12:00").toLocaleDateString("en-US", options);
}

let nextId = 1;
function item(text, properties = {}) {
  return { id: nextId++, text, ...properties };
}

function task(text, done = false, recurring = false) {
  return item(text, { done, recurring });
}

function dated(text, offset = 0) {
  return item(text, { date: dateKey(offset) });
}

const workbench = {
  name: "Restore the garden workbench",
  summary: "Repair the cedar bench and seal the top before it goes back outside.",
  construct: "Lumen", status: "Active", spell: null, messages: [],
  tasks: [
    task("Sand the cedar top"), task("Fill the split along the front edge"),
    task("Apply two coats of exterior oil"), task("Tighten the frame and replace the feet"),
    task("Strip the old finish", true), task("Remove the vise and hardware", true),
  ],
  ideas: [item("Add a shallow tray for screws"), item("Mount a hook for the dust brush"), item("Use brass screws on the vise")],
  notes: [dated("The vise bolts take a 13 mm socket.", -1), dated("Check the shed for the spare tin of oil.", -3)],
  progress: [dated("Stabilized the legs and cross brace.", -4)],
  members: [item("Mara Chen", { role: "Owner", initials: "MC", self: true }), item("Theo Bell", { role: "Member", initials: "TB" })],
};

const water = task("Water the seedlings", true, true);
const plan = task("Plan tomorrow’s work", false, true);
const dailies = {
  name: "Dailies", summary: "Keep up with recurring tasks and get today’s work in order.",
  construct: "Vellum", status: "Active", spell: null, messages: [],
  tasks: [water, plan, task("Pick up potting mix")],
  ideas: [item("Try watering before breakfast")],
  notes: [dated("The seedlings on the south shelf dry out first.", -1)],
  progress: [dated("Watered the seedlings for three days in a row.", -1)],
  members: [item("Mara Chen", { role: "Owner", initials: "MC", self: true })],
  lastDay: { date: dateKey(-1), time: Date.now() - 24 * 60 * 60 * 1000 },
  days: {
    [dateKey(-6)]: { [water.id]: true, [plan.id]: false },
    [dateKey(-5)]: { [water.id]: true, [plan.id]: true },
    [dateKey(-3)]: { [water.id]: true, [plan.id]: true },
    [dateKey(-2)]: { [water.id]: true, [plan.id]: false },
    [dateKey(-1)]: {},
  },
  undoDay: null,
};

const quests = { workbench, dailies };
for (const sample of Object.values(quests)) {
  sample.tasks.forEach((entry, index) => { entry.number = index + 1; });
  sample.nextTaskNumber = sample.tasks.length + 1;
}

function appendTask(text) {
  const entry = task(text);
  entry.number = quest.nextTaskNumber++;
  quest.tasks.push(entry);
}
const spells = [
  { id: "tasks", name: "Tasks", destination: "Tasks", type: "Built-in", reply: "Added to Tasks." },
  { id: "brainstorm", name: "Brainstorm", destination: "Ideas", type: "Built-in", reply: "Saved to Ideas." },
  { id: "workshop", name: "Workshop sparks", destination: "Ideas", type: "Own spell", reply: "I’ve saved that for your next workshop session." },
];
const collectionCopy = {
  tasks: { entry: "task", label: "Task", add: "Add task" },
  ideas: { entry: "idea", label: "Idea", add: "Add idea" },
  notes: { entry: "Quick Note", label: "Quick Note", add: "Save note" },
  progress: { entry: "milestone", label: "Milestone", add: "Add milestone" },
};

let questKey = "workbench";
let currentSection = "overview";
let quest = workbench;
let dialogSubmit = null;
let dialogInvoker = null;
let afterDialogFocus = null;
let taskUndo = new Map();

function sectionHref(section) {
  return `#${questKey}/${section}`;
}

function plural(count, one, many = one + "s") {
  return `${count} ${count === 1 ? one : many}`;
}

function button(label, action, variant = "", attributes = "") {
  return `<button class="btn ${variant}" type="button" data-action="${action}" ${attributes}>${label}</button>`;
}

function link(label, section, variant = "") {
  return `<a class="btn ${variant}" href="${sectionHref(section)}">${label}</a>`;
}

function badge(status) {
  return `<span class="badge">${status}</span>`;
}

function isDailies() {
  return quest === dailies;
}

function elapsedDay() {
  const hours = Math.max(0, Math.floor((Date.now() - quest.lastDay.time) / 3_600_000));
  if (hours === 0) return "Last day started just now";
  if (hours < 48) return `Last day started ${plural(hours, "hour")} ago`;
  return `Last day started ${plural(Math.floor(hours / 24), "day")} ago`;
}

function overview() {
  const openTasks = quest.tasks.filter(({ done }) => !done);
  const next = openTasks[0];
  const feature = isDailies()
    ? `<p class="label">Today</p><div class="feature-line"><strong>${dateLabel(dateKey(), { weekday: "long", month: "short", day: "numeric" })}</strong></div>
       <div class="actions">${button("Start Day", "start-day", "primary")}${quest.undoDay ? button("Undo Start Day", "undo-day") : ""}${link("Day grid " + icon("next"), "days", "quiet")}</div>
       <p class="hint">${elapsedDay()}</p>`
    : `<p class="label">Next task</p><div class="feature-line">${next
      ? `<strong><small>#${next.number}</small><span>${escapeHtml(next.text)}</span></strong>${button(icon("check") + " Check off", "toggle-task", "primary", `data-id="${next.id}"`)}`
      : `<strong>No open tasks</strong>${link("Open Tasks", "tasks")}`}</div>`;
  const sharing = quest.members.some(({ role }) => role === "Member") ? "Shared" : "Personal";
  const portrait = $("#portrait-" + quest.construct.toLowerCase()).innerHTML;
  $("#page-lead").innerHTML = `<section class="paper hero" aria-labelledby="page-title">
    <div class="hero-head"><div class="hero-title"><p class="meta">${badge(quest.status)}<span class="muted">${sharing}</span></p>
      <h1 id="page-title" tabindex="-1">${quest.name}</h1></div>
      <div class="portrait" title="${quest.construct}">${portrait}</div>
    </div><p class="hero-intro">${quest.summary}</p><div class="feature">${feature}</div></section>`;
  const memberCount = quest.members.filter(({ role }) => role !== "Pending").length;
  const summaries = {
    tasks: `${openTasks.length} open · ${quest.tasks.length - openTasks.length} done`,
    ideas: plural(quest.ideas.length, "idea"),
    notes: plural(quest.notes.length, "note"),
    progress: plural(quest.progress.length, "milestone"),
    spells: quest.spell ? `${quest.spell.name} active` : "Cast a spell or change status",
    members: isDailies() ? "Just you" : plural(memberCount, "person", "people") + " in this quest",
  };
  $("#page-content").innerHTML = `<section aria-labelledby="sections-title">
    <h2 class="section-heading" id="sections-title">Quest sections</h2><div class="tiles">${Object.entries(summaries).map(([key, value]) =>
      `<a class="tile" href="${sectionHref(key)}">${icon(key, "tile-icon")}<div><h3>${sectionNames[key]}</h3><p>${value}</p></div>${icon("next", "arrow")}</a>`
    ).join("")}</div></section>`;
}

function optionsMenu(section, entry, number) {
  const attrs = `data-id="${entry.id}" data-section="${section}"`;
  const actions = [button("Edit", "edit-item", "quiet", attrs)];
  if ((section === "tasks" && !entry.done) || section === "ideas") {
    const rows = quest[section].filter((row) => !row.done);
    const index = rows.indexOf(entry);
    if (index > 0) actions.push(button("Move up", "move-item", "quiet", attrs + ' data-step="-1"'));
    if (index < rows.length - 1) actions.push(button("Move down", "move-item", "quiet", attrs + ' data-step="1"'));
  }
  if (section === "tasks" && isDailies()) actions.push(button(entry.recurring ? "Make one-off" : "Make recurring", "toggle-recurring", "quiet", attrs));
  if (section === "ideas") actions.push(button("Move to Tasks", "idea-to-task", "quiet", attrs));
  actions.push(button("Remove", "remove-item", "quiet danger", attrs));
  return `<details class="row-actions"><summary class="btn icon-only" aria-label="Actions for ${escapeHtml(number || entry.text)}" data-row-menu="${entry.id}">${icon("more")}</summary>
    <div class="menu">${actions.join("")}</div></details>`;
}

function row(section, entry) {
  const number = section === "tasks" ? "#" + (entry.number) : "";
  const toggle = section === "tasks" ? button(icon(entry.done ? "reopen" : "check"), "toggle-task", "icon-only",
    `data-id="${entry.id}" aria-label="${entry.done ? "Reopen" : "Check off"} ${escapeHtml(entry.text)}"`) : "";
  const date = entry.date ? `<time datetime="${entry.date}">${dateLabel(entry.date)}</time>` : "";
  const recurring = entry.recurring ? '<p class="hint">↻ Recurring</p>' : "";
  return `<li class="row">${toggle}<div class="row-copy">${number ? `<span data-number>${number}</span> ` : ""}<span class="${entry.done ? "done" : ""}">${escapeHtml(entry.text)}</span>${date}${recurring}</div>${optionsMenu(section, entry, number)}</li>`;
}

function collection(section) {
  const copy = collectionCopy[section];
  const entries = quest[section];
  const open = entries.filter(({ done }) => !done);
  const done = entries.filter((entry) => entry.done);
  const summary = section === "tasks" ? `<p class="muted">${open.length} open · ${done.length} done</p>` : "";
  const undo = section === "tasks" && taskUndo.has(questKey)
    ? button("Undo last Tasks change", "undo-tasks", "quiet") : "";
  return `${summary}<form class="inline-form" data-form="add-item" data-section="${section}">
      <label class="field"><span>${copy.label}</span><input name="text" required maxlength="160" placeholder="${copy.label}"></label>
      <button class="btn primary" type="submit">${copy.add}</button>
    </form>
    ${open.length ? `<ul class="rows">${open.map((entry) => row(section, entry)).join("")}</ul>` : `<p class="muted">No ${section === "tasks" ? "open tasks" : sectionNames[section].toLowerCase()} yet.</p>`}
    ${done.length ? `<h2 class="subheading">Done (${done.length})</h2><ul class="rows">${done.map((entry) => row(section, entry)).join("")}</ul>` : ""}${undo}`;
}

function spellSection() {
  const rows = spells.map((spell) => {
    const active = quest.spell?.id === spell.id;
    const attrs = `data-id="${spell.id}" aria-label="Cast ${spell.name}"`;
    return `<li class="row"><div class="row-copy"><strong>${spell.name}</strong><p class="hint">${spell.type} · Saves to ${spell.destination}</p></div>
      ${active ? badge("Active spell") : button("Cast", "cast", "primary", attrs)}</li>`;
  }).join("");
  return `<h2>Spells</h2><ul class="rows">${rows}</ul>
    <h2 class="subheading">Quest status</h2><div class="actions status-controls">${badge(quest.status)}${quest.status === "Active"
      ? button("Complete", "status", "", 'data-status="Completed"') + button("Abandon", "status", "quiet danger", 'data-status="Abandoned"')
      : button("Restore quest", "status", "primary", 'data-status="Active"')}</div>`;
}

function membersSection() {
  const rows = quest.members.map((member) => {
    let actions = "";
    if (member.role === "Member") actions = button("Remove", "remove-member", "quiet danger", `data-id="${member.id}"`);
    if (member.role === "Pending") actions = button("Withdraw", "remove-member", "quiet", `data-id="${member.id}"`);
    return `<li class="row"><span class="member-avatar" aria-hidden="true">${member.initials}</span><div class="row-copy"><strong>${escapeHtml(member.text)}${member.self ? " (you)" : ""}</strong>
      <p class="hint">${member.role === "Pending" ? "Invited, not accepted yet" : member.role}</p></div>${actions}</li>`;
  }).join("");
  return `${isDailies() ? '<p class="muted">Dailies is just for you.</p>' :
    `<form class="inline-form" data-form="invite"><label class="field"><span>Invite by email</span><input type="email" maxlength="120" required name="email" placeholder="name@example.com"></label><button class="btn primary" type="submit">Invite</button></form>`}
    <ul class="rows" aria-label="People in this quest">${rows}</ul>`;
}

function dayGrid() {
  const dates = Array.from({ length: 7 }, (_, index) => dateKey(index - 6));
  const recurring = quest.tasks.filter(({ recurring }) => recurring);
  const cells = (entry) => dates.map((date) => {
    let state = "gap";
    let description = "no day started";
    if (date === quest.lastDay.date) {
      state = entry.done ? "done" : "open";
      description = entry.done ? "done" : "not done yet";
    } else if (quest.days[date]) {
      const recorded = quest.days[date][entry.id];
      state = recorded === undefined ? "untracked" : recorded ? "done" : "open";
      description = recorded === undefined ? "not recurring that day" : recorded ? "done" : "not done";
    }
    return `<td><span class="mark ${state}" title="${dateLabel(date)} · ${description}" aria-hidden="true"></span><span class="visually-hidden">${description}</span></td>`;
  }).join("");
  return `<h2>Recurring tasks</h2>${recurring.length ? `<table class="calendar"><thead><tr><th scope="col">Task</th>${dates.map((date) => `<th scope="col"><time datetime="${date}" title="${dateLabel(date)}">${date.slice(-2)}</time></th>`).join("")}</tr></thead>
      <tbody>${recurring.map((entry) => `<tr><th scope="row">${escapeHtml(entry.text)}</th>${cells(entry)}</tr>`).join("")}</tbody></table>
      <p class="hint">Filled means done. Empty means not done. Dashed marks a day you didn’t start.</p>`
    : '<p class="muted">Make a task recurring from its menu in Tasks to track it here.</p>'}`;
}

function renderPage(focus = false) {
  $("#trail-current").textContent = currentSection === "overview" ? quest.name : `${quest.name} › ${sectionNames[currentSection]}`;
  if (currentSection === "overview") {
    overview();
  } else {
    $("#page-lead").innerHTML = `${link(icon("back") + " Overview", "overview", "quiet back")}
      <div class="section-title"><h1 id="page-title" tabindex="-1">${sectionNames[currentSection]}</h1></div>`;
    let content;
    if (currentSection === "days") content = dayGrid();
    else if (currentSection === "members") content = membersSection();
    else if (currentSection === "spells") content = spellSection();
    else content = collection(currentSection);
    $("#page-content").innerHTML = `<section class="paper" aria-labelledby="page-title">${content}</section>`;
  }
  renderConversation();
  if (focus) $("#page-title").focus({ preventScroll: true });
}

function renderConversation() {
  const region = $("#conversation");
  if (!quest.spell) {
    region.replaceChildren();
    return;
  }
  const draft = region.querySelector("input")?.value ?? "";
  const spell = quest.spell;
  region.innerHTML = `<section class="paper conversation" aria-labelledby="spell-name">
    <header><div><h2 id="spell-name">${spell.name}</h2><p class="hint">Messages save to ${spell.destination}</p></div>
      ${button("Stop " + spell.name, "stop-spell")}</header>
    <ol class="transcript" aria-label="Spell conversation" aria-live="polite">${quest.messages.map(({ author, text }) =>
      `<li class="message ${author === "You" ? "user" : ""}"><b>${author}</b><span>${escapeHtml(text)}</span></li>`
    ).join("")}</ol>
    <form class="inline-form" data-form="message"><label class="field"><span>Message</span><input name="text" required maxlength="160" placeholder="Write a message" value="${escapeHtml(draft)}"></label><button class="btn primary" type="submit">Send</button></form>
  </section>`;
  const transcript = region.querySelector(".transcript");
  transcript.scrollTop = transcript.scrollHeight;
}

function feedback(message = "") {
  $("#feedback").textContent = message;
}

function sendSpellMessage(text) {
  if (!quest.spell || !text) return false;
  const { destination, reply } = quest.spell;
  if (destination === "Tasks") {
    saveTasksUndo();
    appendTask(text);
  }
  else quest.ideas.push(item(text));
  quest.messages.push({ author: "You", text }, { author: quest.construct, text: reply });
  if (isDailies()) quest.undoDay = null;
  return true;
}

function cast(id, focus = true) {
  const spell = spells.find((candidate) => candidate.id === id);
  if (!spell) return;
  quest.spell = spell;
  quest.messages = [{ author: quest.construct, text: `Send a message to save it to ${spell.destination}.` }];
  $("#conversation").replaceChildren();
  renderPage();
  if (focus) $("#conversation input").focus();
}

function restoreControl(action, id = "") {
  const controls = document.querySelectorAll(`[data-action="${action}"]`);
  const control = [...controls].find((candidate) => !id || candidate.dataset.id === id);
  focusAfterAction(control || $("#page-title"));
}

function focusAfterAction(control) {
  if (!control) return;
  if ($("#interaction").open) afterDialogFocus = control;
  else control.focus({ preventScroll: true });
}

function refresh(message, action, id) {
  renderPage();
  feedback(message);
  if (action) restoreControl(action, id);
}

function openDialog(title, body, submitLabel, submit, invoker) {
  const dialog = $("#interaction");
  $("#dialog-title").textContent = title;
  $("#dialog-body").innerHTML = body;
  $("#dialog-confirm").textContent = submitLabel;
  dialogSubmit = submit;
  dialogInvoker = invoker;
  afterDialogFocus = null;
  dialog.showModal();
}

function confirmAction(title, message, label, submit, invoker) {
  openDialog(title, `<p>${message}</p>`, label, submit, invoker);
}

function saveTasksUndo() {
  taskUndo.set(questKey, { tasks: structuredClone(quest.tasks) });
}

function handleItemAction(control) {
  const { action, id, section, step } = control.dataset;
  const target = section || "tasks";
  const entries = quest[target];
  const entry = entries.find((row) => row.id === Number(id));
  if (!entry) return;
  const invoker = control.closest("details")?.querySelector("summary") || control;
  if (action === "edit-item") {
    const { label } = collectionCopy[target];
    openDialog("Edit " + label, `<label class="field"><span>${label}</span><input name="text" required maxlength="160" autofocus value="${escapeHtml(entry.text)}"></label>`, "Save",
      (data) => {
        const text = data.get("text").trim();
        if (!text) return false;
        if (target === "tasks") saveTasksUndo();
        entry.text = text;
        refresh("Changes saved.");
        focusAfterAction(document.querySelector(`[data-row-menu="${id}"]`));
      }, invoker);
  } else if (action === "remove-item") {
    const { entry: name } = collectionCopy[target];
    confirmAction("Remove " + name + "?", `Remove “${escapeHtml(entry.text)}”?`, "Remove", () => {
      if (target === "tasks") saveTasksUndo();
      entries.splice(entries.indexOf(entry), 1);
      refresh("Removed.");
      focusAfterAction($("#page-title"));
    }, invoker);
  } else if (action === "toggle-task") {
    saveTasksUndo();
    entry.done = !entry.done;
    refresh(entry.done ? "Task checked off." : "Task reopened.", "toggle-task", currentSection === "overview" ? "" : id);
  } else if (action === "move-item") {
    const open = entries.filter((row) => !row.done);
    const swap = open[open.indexOf(entry) + Number(step)];
    if (!swap) return;
    if (target === "tasks") saveTasksUndo();
    const from = entries.indexOf(entry);
    const to = entries.indexOf(swap);
    [entries[from], entries[to]] = [entries[to], entries[from]];
    refresh("Order saved.");
    focusAfterAction(document.querySelector(`[data-row-menu="${id}"]`));
  } else if (action === "toggle-recurring") {
    saveTasksUndo();
    entry.recurring = !entry.recurring;
    refresh(entry.recurring ? "Task made recurring." : "Task made one-off.");
    focusAfterAction(document.querySelector(`[data-row-menu="${id}"]`));
  } else if (action === "idea-to-task") {
    taskUndo.set(questKey, { tasks: structuredClone(quest.tasks), movedIdea: entry, ideaIndex: entries.indexOf(entry) });
    entries.splice(entries.indexOf(entry), 1);
    appendTask(entry.text);
    refresh("Moved to Tasks.");
    focusAfterAction($("#page-title"));
  }
}

function startDay(data) {
  const snapshot = structuredClone({
    tasks: quest.tasks, ideas: quest.ideas, lastDay: quest.lastDay, days: quest.days,
    spell: quest.spell, messages: quest.messages,
  });
  const priorDate = quest.lastDay.date;
  const recorded = quest.days[priorDate] || {};
  for (const entry of quest.tasks.filter(({ recurring }) => recurring)) {
    recorded[entry.id] = Boolean(recorded[entry.id] || entry.done);
    entry.done = false;
  }
  quest.days[priorDate] = recorded;
  quest.lastDay = { date: dateKey(), time: Date.now() };
  if (data.has("clear-tasks")) quest.tasks = [];
  if (data.has("clear-ideas")) quest.ideas = [];
  quest.spell = null;
  quest.messages = [];
  quest.undoDay = snapshot;
  taskUndo.delete(questKey);
  refresh("Day started.", "undo-day");
}

function undoDay() {
  if (!quest.undoDay) return;
  Object.assign(quest, quest.undoDay, { undoDay: null });
  taskUndo.delete(questKey);
  refresh("Start Day undone.", "start-day");
}

function chooseAppearance(mode) {
  document.documentElement.dataset.mode = mode;
  for (const swatch of document.querySelectorAll(".appearances button")) {
    swatch.setAttribute("aria-pressed", String(swatch.dataset.mode === mode));
  }
}

function navigate(focus = true, route = location.hash.slice(1)) {
  const previousKey = questKey;
  const [key, section] = route.split("/");
  questKey = Object.hasOwn(quests, key) ? key : "workbench";
  quest = quests[questKey];
  currentSection = Object.hasOwn(sectionNames, section) ? section : "overview";
  if (currentSection === "days" && !isDailies()) currentSection = "overview";
  $("#quest-picker").close();
  if (questKey !== previousKey) $("#conversation").replaceChildren();
  feedback();
  renderPage(focus);
  if (focus) window.scrollTo(0, 0);
}

const mobile = matchMedia("(max-width: 679px)");
function placeTimer() {
  const drawer = $("#timer-drawer");
  const panel = $("#timer-panel");
  if (mobile.matches) drawer.append(panel);
  else {
    drawer.close();
    $("#timer-dock").append(panel);
  }
}

const timerForm = $("#timer-form");
const presets = [10, 15, 25, 30, 45, 50, 60, 120];
for (const [name, initial] of [["work", 50], ["rest", 10]]) {
  const select = timerForm.elements.namedItem(name);
  for (const preset of presets) select.add(new Option(`${preset} minutes`, preset));
  select.value = String(initial);
}
$("#timer-face").prepend($("#timer-art").content.cloneNode(true));

let schedule = null;
let lastPhase = "";
function updateTimer() {
  if (!schedule) return;
  const elapsed = Math.max(0, Date.now() - schedule.start);
  const cycle = elapsed % (schedule.work + schedule.rest);
  const work = cycle < schedule.work;
  const phase = work ? "Work" : "Break";
  const total = work ? schedule.work : schedule.rest;
  const intoPhase = work ? cycle : cycle - schedule.work;
  const remaining = Math.ceil((total - intoPhase) / 1000);
  const fraction = intoPhase / total;
  const parts = [Math.floor(remaining / 60) % 60, remaining % 60];
  if (remaining >= 3600) parts.unshift(Math.floor(remaining / 3600));
  $("#timer-phase").textContent = phase;
  const countdown = $("#timer-countdown");
  countdown.textContent = parts.map((part) => String(part).padStart(2, "0")).join(":");
  countdown.classList.toggle("hours", parts.length === 3);
  const next = work ? schedule.rest : schedule.work;
  $("#timer-next").textContent = `Next · ${work ? "Break" : "Work"} ${next / 60000} min`;
  if (phase !== lastPhase) {
    $("#phase-announcement").textContent = `${phase} time.`;
    lastPhase = phase;
  }
  $("#timer-arc").dataset.phase = phase;
  $("#timer-arc").setAttribute("stroke-dasharray", `${fraction * 100} 100`);
  for (const marker of document.querySelectorAll(".timer-marker")) {
    marker.dataset.passed = String(Number(marker.dataset.index) / 12 <= fraction);
  }
  $("#sand-top").setAttribute("y", String(55 + 142 * fraction));
  $("#sand-top").setAttribute("height", String(142 * (1 - fraction)));
  $("#sand-bottom").setAttribute("y", String(347 - 137 * fraction));
  $("#sand-bottom").setAttribute("height", String(137 * fraction));
  $("#sand-stream").setAttribute("d", fraction > 0 ? `M115 203V${347 - 137 * fraction}` : "");
}

document.addEventListener("click", (event) => {
  const mode = event.target.closest(".appearances button");
  if (mode) {
    chooseAppearance(mode.dataset.mode);
    return;
  }
  const control = event.target.closest("[data-action]");
  if (!control) {
    const activeMenu = event.target.closest(".row-actions");
    for (const menu of document.querySelectorAll(".row-actions[open]")) {
      if (menu !== activeMenu) menu.open = false;
    }
    return;
  }
  const { action, id, status } = control.dataset;
  switch (action) {
    case "choose-quest":
      event.preventDefault();
      $("#quest-picker").showModal();
      break;
    case "close-quests":
      $("#quest-picker").close();
      break;
    case "open-timer":
      control.focus({ preventScroll: true });
      $("#timer-drawer").showModal();
      break;
    case "close-timer":
      $("#timer-drawer").close();
      break;
    case "cancel-dialog":
      $("#interaction").close();
      break;
    case "cast":
      feedback();
      cast(id);
      break;
    case "stop-spell":
      const stoppedId = quest.spell?.id;
      quest.spell = null;
      quest.messages = [];
      refresh("Spell stopped.", currentSection === "spells" ? "cast" : "", stoppedId);
      if (currentSection !== "spells") $("#page-title").focus({ preventScroll: true });
      break;
    case "status": {
      const label = { Active: "Restore quest", Completed: "Complete quest", Abandoned: "Abandon quest" }[status];
      confirmAction(label + "?", `Change the quest’s status to ${status}?`, label, () => {
        quest.status = status;
        refresh("Quest status saved.", "status");
      }, control);
      break;
    }
    case "start-day":
      openDialog("Start Day", `<p>Record today’s date and reopen completed recurring tasks.</p>
        <label class="actions"><input type="checkbox" name="clear-tasks"> Remove all Tasks</label>
        <label class="actions"><input type="checkbox" name="clear-ideas"> Remove all Ideas</label>`, "Start Day", startDay, control);
      break;
    case "undo-day":
      undoDay();
      break;
    case "undo-tasks": {
      const undo = taskUndo.get(questKey);
      if (!undo) break;
      quest.tasks = undo.tasks;
      if (undo.movedIdea) quest.ideas.splice(undo.ideaIndex, 0, undo.movedIdea);
      taskUndo.delete(questKey);
      renderPage(true);
      feedback("Undid the last Tasks change.");
      break;
    }
    case "remove-member": {
      const member = quest.members.find((entry) => entry.id === Number(id));
      if (!member || member.role === "Owner" || isDailies()) break;
      const invited = member.role === "Pending";
      confirmAction(invited ? "Withdraw invitation?" : "Remove member?",
        invited ? `Withdraw the invitation for ${escapeHtml(member.text)}?` : `${escapeHtml(member.text)} will lose access to this quest.`,
        invited ? "Withdraw" : "Remove",
        () => {
          quest.members.splice(quest.members.indexOf(member), 1);
          refresh(invited ? "Invitation withdrawn." : "Member removed.");
          focusAfterAction($("#page-title"));
        }, control);
      break;
    }
    default:
      handleItemAction(control);
  }
});

document.addEventListener("submit", (event) => {
  event.preventDefault();
  const form = event.target;
  const data = new FormData(form);
  if (form === timerForm) {
    schedule = { work: Number(data.get("work")) * 60000, rest: Number(data.get("rest")) * 60000, start: Date.now() };
    lastPhase = "";
    $("#timer-running").hidden = false;
    timerForm.querySelector("button").textContent = "Start again";
    updateTimer();
    return;
  }
  if (form.id === "dialog-form") {
    if (dialogSubmit?.(data) !== false) $("#interaction").close();
    return;
  }
  if (form.dataset.form === "message") {
    if (sendSpellMessage(String(data.get("text") ?? "").trim())) {
      form.reset();
      form.elements.namedItem("text").value = "";
      renderPage();
      $("#conversation input").focus();
    }
    return;
  }
  if (form.dataset.form === "add-item") {
    const { section } = form.dataset;
    const text = data.get("text").trim();
    if (!text) return;
    if (section === "tasks") {
      saveTasksUndo();
      appendTask(text);
    } else if (section === "ideas") quest.ideas.push(item(text));
    else quest[section].unshift(dated(text));
    refresh(`Added to ${sectionNames[section]}.`);
    $('[data-form="add-item"] input').focus();
    return;
  }
  if (form.dataset.form === "invite" && !isDailies()) {
    const email = data.get("email").trim().toLowerCase();
    if (quest.members.some(({ text }) => text.toLowerCase() === email)) {
      feedback("This address already has an invitation.");
      return;
    }
    quest.members.push(item(email, { role: "Pending", initials: "@" }));
    refresh("Invitation added.");
    $('[data-form="invite"] input').focus();
  }
});

$("#timer-drawer").addEventListener("close", () => {
  if (mobile.matches) $(".timer-open").focus({ preventScroll: true });
});

$("#interaction").addEventListener("close", () => {
  const target = afterDialogFocus || dialogInvoker;
  if (target?.isConnected) target.focus({ preventScroll: true });
});

window.addEventListener("hashchange", () => navigate());
document.addEventListener("visibilitychange", updateTimer);
mobile.addEventListener("change", placeTimer);
$("#medallion").innerHTML = icon("compass");
$("#timer-icon").innerHTML = icon("timer");
placeTimer();
chooseAppearance(document.documentElement.dataset.mode);
navigate(false);
setInterval(updateTimer, 250);
</script>
</body>
</html>
