min_version = "2026.9.4"
monorepo_root = true

[monorepo]
config_roots = ["apps/web", "apps/instruction-counter"]

[tools]
node = "24"

# The three quality tasks. Each runs the same npm script in every workspace.
[tasks.lint]
description = "Run Biome and the type check in every workspace"
run = "npm run lint"

[tasks.test]
description = "Run React Doctor and every test but the browser and end-to-end tests in every workspace"
run = "npm test"

[tasks."test:e2e"]
description = "Run the browser tests and the end-to-end tests"
run = "npm run test:e2e"

[tasks.setup]
description = "Install dependencies and prepare the persistent local development environment"
run = 'node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON "{{config_root}}/apps/web/scripts/development/run.ts" setup'

[tasks.doctor]
description = "Check development prerequisites, configuration and database without changing them"
run = 'node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON "{{config_root}}/apps/web/scripts/development/run.ts" doctor'

[tasks.sign-in-link]
description = "Print a sign-in link for EMAIL, or the developer account, making the account if it's missing"
usage = 'arg "[email]" help="The address to sign in as; developer@project-buddy.test without one"'
run = 'node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON "{{config_root}}/apps/web/scripts/development/run.ts" sign-in-link {{usage.email}}'

# Vercel operations. They need a personal `vercel login`. Pulled environments
# are written outside the checkout; see scripts/ops/project.sh.
[tasks."ops:link"]
description = "Link this checkout to the site's Vercel project, so the other ops tasks and the vercel CLI work without --scope"
run = 'bash "{{config_root}}/scripts/ops/link.sh"'

[tasks."ops:env"]
description = "Pull one environment's variables to a private file outside the checkout, and print their names"
usage = '''
arg "[environment]" help="production, preview or development"
'''
run = 'bash "{{config_root}}/scripts/ops/pull-env.sh" "$usage_environment"'

[tasks."ops:query"]
description = "Run one read-only SQL statement against an environment's database, and print the rows as JSON"
usage = '''
arg "[environment]" help="production, preview or development"
arg "[sql]" help="One SQL statement, quoted"
'''
run = 'node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON "{{config_root}}/scripts/ops/query.ts" "$usage_environment" "$usage_sql"'

# Which local scripts recent T3 Code threads for this project ran, and which
# they did not, read from T3 Code's local database.
[tasks.script-usage]
description = "List the npm scripts, mise tasks and script files the last N T3 Code threads ran, and those they did not, with where each is defined; --help for the options"
run = 'node "{{config_root}}/scripts/script-usage.mts"'
