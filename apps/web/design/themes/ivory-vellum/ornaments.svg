<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Ivory Vellum ornaments. Hand-written for this project on
       2026-11-17; no icon library or generated art, so no attribution is
       needed. Each symbol is a mask, as in themes/_template/: draw in black,
       and only opacity counts. Parts marked data-ink="accent" take
       the ornament accent ink (gold leaf); the rest take the ornament ink
       (sepia). The motifs come from the scribe's hourglass
       (apps/web/src/components/timer/timer-hourglass.tsx): its tall gilt
       lozenge finials (4 wide by 12 tall, a 1:1.5 rhombus), its paired
       keylines, its dark end bars and its dotted stream of sand. -->

  <!-- Frame corner, top left. The corner box starts a quarter of its size
       outside the inner keyline, so the keyline crosses at (6, 6). The
       keyline itself draws the corner's arms, so the symbol adds only a
       short bracket inside it, a pen dot, and a slim gilt lozenge on the
       crossing. Drawing the arms again doubled the line at the mirrored
       corners, where they land half a pixel off the keyline. -->
  <symbol id="orn-corner" viewBox="0 0 24 24">
    <path d="M9.5 18V9.5H18" fill="none" stroke="#000" stroke-width="1"/>
    <circle cx="12.6" cy="12.6" r="1.1"/>
    <path data-ink="accent" d="m6.5 1.9 2.2 4.6-2.2 4.6-2.2-4.6Z"/>
  </symbol>

  <!-- The glyph at a divider's centre: a tall gilt lozenge between two
       sepia rings, with hairline tails that meet the CSS rule. -->
  <symbol id="orn-divider" viewBox="0 0 32 16">
    <path d="M0 8h9.2M22.8 8H32" fill="none" stroke="#000" stroke-width=".9"/>
    <circle cx="11" cy="8" r="1.4" fill="none" stroke="#000" stroke-width=".8"/>
    <circle cx="21" cy="8" r="1.4" fill="none" stroke="#000" stroke-width=".8"/>
    <path data-ink="accent" d="m16 2 3.2 6-3.2 6-3.2-6Z"/>
  </symbol>

  <!-- The mark before a section heading: the hourglass's finial, a tall
       gilt lozenge, with a sepia keyline beneath it like a scribe's guide
       line. -->
  <symbol id="orn-heading" viewBox="0 0 16 16">
    <path d="M2 14.5h12" fill="none" stroke="#000" stroke-width=".9"/>
    <path data-ink="accent" d="m8 1.5 3.4 5.6L8 12.7 4.6 7.1Z"/>
  </symbol>

  <!-- One tile of the band under the trail band. It repeats across: a
       sepia hairline above a dotted line of sand, broken every tile by a
       small gilt lozenge. Drawn 48 wide so the lozenges stay sparse. -->
  <symbol id="orn-band" viewBox="0 0 48 6">
    <path d="M0 1h20m8 0h20" fill="none" stroke="#000" stroke-width=".9"/>
    <path d="M1 4.6h18m10 0h18" fill="none" stroke="#000" stroke-width=".9" stroke-dasharray=".9 2.1"/>
    <path data-ink="accent" d="m24 .2 2 2.8-2 2.8-2-2.8Z"/>
  </symbol>

  <!-- Empty state and sign-in emblem: the scribe's hourglass in a double
       roundel, with gilt lozenges at the four quarters. The sand is gilt. -->
  <symbol id="orn-emblem" viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="21.5" fill="none" stroke="#000" stroke-width="1.1"/>
    <circle cx="24" cy="24" r="18.6" fill="none" stroke="#000" stroke-width=".55"/>
    <path d="M16.5 12.3h15v1.5h-15ZM16.5 34.2h15v1.5h-15Z"/>
    <path d="M17.6 14.4v19.2M30.4 14.4v19.2" fill="none" stroke="#000" stroke-width=".55"/>
    <path d="M19.3 14.6c0 4.6 1.8 7.2 4 9.4-2.2 2.2-4 4.8-4 9.4M28.7 14.6c0 4.6-1.8 7.2-4 9.4 2.2 2.2 4 4.8 4 9.4" fill="none" stroke="#000" stroke-width=".8"/>
    <path data-ink="accent" d="M20.6 18.4h6.8c-.5 2-1.6 3.5-3.4 4.9-1.8-1.4-2.9-2.9-3.4-4.9Z"/>
    <path data-ink="accent" d="M20 33.2c.3-2.8 1.5-4.4 4-5.3 2.5.9 3.7 2.5 4 5.3Z"/>
    <path data-ink="accent" d="M24 24.6v3" fill="none" stroke="#000" stroke-width=".7" stroke-dasharray=".7 .9"/>
    <path data-ink="accent" d="m24 0 1.6 2.5L24 5l-1.6-2.5ZM24 43l1.6 2.5L24 48l-1.6-2.5ZM0 24l2.5-1.6L5 24l-2.5 1.6ZM43 24l2.5-1.6L48 24l-2.5 1.6Z"/>
  </symbol>

  <!-- Appearance swatch ornament, drawn over the swatch's texture: a
       double keyline with gilt lozenge corners, and a small hourglass at
       the centre so the swatch previews the timer it brings. -->
  <symbol id="orn-swatch" viewBox="0 0 64 64">
    <path d="M7 7h50v50H7Z" fill="none" stroke="#000" stroke-width="1.4"/>
    <path d="M10.5 10.5h43v43h-43Z" fill="none" stroke="#000" stroke-width=".6"/>
    <path d="M25 19h14v1.8H25ZM25 43.2h14V45H25Z"/>
    <path d="M27 21.5c0 5 1.8 7.8 4.2 10.5-2.4 2.7-4.2 5.5-4.2 10.5M37 21.5c0 5-1.8 7.8-4.2 10.5 2.4 2.7 4.2 5.5 4.2 10.5" fill="none" stroke="#000" stroke-width="1"/>
    <path data-ink="accent" d="M28.4 25.5h7.2c-.6 2.2-1.7 3.8-3.6 5.3-1.9-1.5-3-3.1-3.6-5.3Z"/>
    <path data-ink="accent" d="M27.8 42.2c.3-3.1 1.6-4.9 4.2-5.9 2.6 1 3.9 2.8 4.2 5.9Z"/>
    <path data-ink="accent" d="m7 2.5 2.4 4.5L7 11.5 4.6 7ZM57 2.5l2.4 4.5-2.4 4.5L54.6 7ZM7 52.5l2.4 4.5L7 61.5 4.6 57ZM57 52.5l2.4 4.5-2.4 4.5-2.4-4.5Z"/>
  </symbol>

  <!-- Construct portrait frame, stretched over the portrait plus its bleed.
       A sepia hairline outside a gilt rule, like a manuscript miniature's
       border, with gilt lozenges at the corners and the middle of each
       side. Everything stays within the outer 3.6 units, inside the bleed
       of 0.625rem, so nothing covers the construct. -->
  <symbol id="orn-portrait" viewBox="0 0 100 100">
    <path d="M.8.8h98.4v98.4H.8Z" fill="none" stroke="#000" stroke-width=".6"/>
    <path data-ink="accent" d="M2.3 2.3h95.4v95.4H2.3Z" fill="none" stroke="#000" stroke-width=".9"/>
    <path data-ink="accent" d="m2.3 0 1.3 2.3-1.3 2.3L1 2.3Zm95.4 0L99 2.3l-1.3 2.3-1.3-2.3ZM2.3 95.4l1.3 2.3L2.3 100 1 97.7Zm95.4 0 1.3 2.3-1.3 2.3-1.3-2.3ZM50 .6l1.5 1.7L50 4l-1.5-1.7ZM50 96l1.5 1.7-1.5 1.7-1.5-1.7ZM.6 50l1.7-1.5L4 50l-1.7 1.5ZM96 50l1.7-1.5 1.7 1.5-1.7 1.5Z"/>
  </symbol>

  <!-- A list item's or notice's marker: the finial lozenge, one ink. -->
  <symbol id="orn-bullet" viewBox="0 0 8 8">
    <path d="m4 .4 2.3 3.6L4 7.6 1.7 4Z"/>
  </symbol>

  <!-- Optional slots: rule end, vignette and notice. -->

  <!-- Rule end: a penwork terminal for either end of a long rule. The rule
       arrives from the right at y = 4 and ends in a curl and a lozenge. -->
  <symbol id="orn-rule-end" viewBox="0 0 24 8">
    <path d="M24 4H10.5c-2 0-3.2-1.1-3.2-2.4 0-1 .8-1.6 1.6-1.6" fill="none" stroke="#000" stroke-width=".8"/>
    <path data-ink="accent" d="m3.6 1.2 2 2.8-2 2.8-2-2.8Z"/>
  </symbol>

  <!-- Empty-state vignette: an open codex on a lectern line, a quill laid
       across it, and penwork scrolls either side ending in gilt lozenges.
       Wider than the emblem, for a list with nothing in it. -->
  <symbol id="orn-vignette" viewBox="0 0 120 48">
    <path d="M60 14c-6-3.4-14-4.6-24-3.6V36c10-1 18 .2 24 3.6 6-3.4 14-4.6 24-3.6V10.4c-10-1-18 .2-24 3.6Z" fill="none" stroke="#000" stroke-width="1"/>
    <path d="M60 14v25.6" fill="none" stroke="#000" stroke-width=".7"/>
    <path d="M40 16.4c6-.6 11.6.2 16 2M40 21c6-.6 11.6.2 16 2M40 25.6c6-.6 11.6.2 16 2M64 18.4c4.4-1.8 10-2.6 16-2M64 23c4.4-1.8 10-2.6 16-2" fill="none" stroke="#000" stroke-width=".55" stroke-dasharray="2.2 1.4"/>
    <path d="M30 42h60" fill="none" stroke="#000" stroke-width=".9"/>
    <path d="M28 24c-4 0-6-2.4-6-5s2-4 4-4 3 1.4 3 2.8M92 24c4 0 6-2.4 6-5s-2-4-4-4-3 1.4-3 2.8M28 24H12M92 24h16" fill="none" stroke="#000" stroke-width=".7"/>
    <path d="M68 37.2 100.4 5.6" fill="none" stroke="#000" stroke-width=".6"/>
    <path d="m67.4 37.8.9-3.2 2.3 2.3Z"/>
    <path data-ink="accent" d="M77.2 27.6C83 19.4 91.4 11.2 100.4 5.6c-3.8 8.4-11.6 16.6-20.6 24.6Z"/>
    <path data-ink="accent" d="m8 21.2 2 2.8-2 2.8-2-2.8ZM112 21.2l2 2.8-2 2.8-2-2.8ZM60 6.2l1.8 2.8-1.8 2.8-1.8-2.8Z"/>
  </symbol>

  <!-- Notice mark, set half outside a notice's top start corner: a sepia
       lozenge outline holding a solid gilt finial. -->
  <symbol id="orn-notice" viewBox="0 0 16 16">
    <path d="m8 .8 5 7.2-5 7.2L3 8Z" fill="none" stroke="#000" stroke-width="1.2"/>
    <path data-ink="accent" d="m8 4.4 2.4 3.6L8 11.6 5.6 8Z"/>
  </symbol>
</svg>
