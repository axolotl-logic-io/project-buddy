<circle class="f-shade s-ink" stroke-width="1.4" cx="40" cy="28" r="7.2"/><circle cx="40" cy="28" r="5.3" fill="url(#vellum-avatar-lens)"/><circle class="f-ink" cx="40.5" cy="29" r="2.3"/><path class="f-metal s-ink" stroke-width="1" d="M34.7 28A5.3 5.3 0 0 1 45.3 28Q40 25.4 34.7 28Z"/>
