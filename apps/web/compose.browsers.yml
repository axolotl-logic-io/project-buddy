# The browsers every browser test and screenshot runs in: Playwright's own
# Linux image, so a page renders the same pixels on any host, and one set of
# visual baselines serves macOS and Linux alike (`os-neutral-browsers`).
# Playwright and Vitest connect to its server over port 3333; pages still
# load the site and Vitest's server from the host's localhost, through the
# connection (`exposeNetwork` in playwright.config.ts and vitest.config.mts).
# `npm run browsers:up` starts it, and the test commands that need it run
# that first. Several worktrees can share it: each connection gets its own
# browser. The image's Playwright must be the version in package-lock.json;
# test/browsers/browser-server.test.ts checks they match.
name: project-buddy-browsers
services:
  playwright:
    image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    init: true
    user: pwuser
    working_dir: /home/pwuser
    command:
      [
        "npx",
        "--yes",
        "playwright@1.64.0",
        "run-server",
        "--port=3333",
        "--host=0.0.0.0",
        # Lets a client pass browser arguments, such as the visual projects'
        # --disable-partial-raster (playwright.config.ts); without it the
        # server drops them. The port is published only to this machine.
        "--unsafe",
      ]
    ports:
      - "127.0.0.1:3333:3333"
    # Chromium runs out of the default 64 MB of shared memory on big pages.
    ipc: host
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3333"]
      interval: 1s
      timeout: 3s
      retries: 120
