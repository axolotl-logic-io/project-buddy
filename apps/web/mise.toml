# The site's tasks. Each runs in this folder and uses the node version from
# the root mise.toml. Run them from anywhere with `mise //apps/web:<task>`.

[tasks.lint]
description = "Biome and the type check"
run = "npm run lint"

[tasks.test]
description = "React Doctor, then script, repository and Vite guards, and server tests against the test database"
run = "npm test"

[tasks."test:e2e"]
description = "The Vitest browser tests, then reset the test database and run the Playwright end-to-end tests against a production build"
run = "npm run test:e2e"

[tasks.build]
run = "npm run build"

[tasks.dev]
run = "npm run dev"
