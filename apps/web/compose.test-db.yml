# Shared local PostgreSQL test server. Each worktree/lane has its own database.
# Test data is held in memory and disappears when the server stops.
name: project-buddy-test-db
services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    # Concurrent lane suites share this server. Each application pool is bounded.
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=main"]
      interval: 1s
      timeout: 3s
      retries: 30
