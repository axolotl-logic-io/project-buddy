# The instruction counter's tasks. Run one from anywhere with
# `mise run //apps/instruction-counter:<task>`; a root task of the same name
# runs it for every app that has it.

[tasks.count]
description = "Measure one text file; emit one JSON line"
usage = 'arg "<file>" help="Text file to measure"'
run = 'node src/cli.ts "$usage_file"'

[tasks.lint]
description = "Typecheck and run Biome"
run = ["tsc -p .", "biome check --error-on-warnings"]

[tasks.format]
description = "Format the instruction counter's files with Biome"
run = "biome format --write"

[tasks.test]
description = "Test without calling a live model"
run = "vitest run --reporter=default --reporter=../web/scripts/test-env/vitest-failures.ts"
