# Releases each main push: build without going live, migrate, promote, and
# smoke-test. Vercel Git deployments stay disabled to avoid duplicate releases.
#
# Needs the repo secrets VERCEL_TOKEN and PRODUCTION_DATABASE_URL, and the
# repo variables VERCEL_ORG_ID and VERCEL_PROJECT_ID. No step prints a
# secret: keep `set -x` out of these scripts.
name: Release

on:
  push:
    branches: [main]

# Releases never overlap. A newer request waiting here replaces an older one
# that hasn't started yet; a release that has started always finishes.
concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Keep this above the sum of the step limits below (45) plus setup and
    # the report, so a slow step fails on its own limit and the failure
    # report still runs.
    timeout-minutes: 60
    env:
      # The Vercel CLI links to the project through these two, and the REST
      # API scripts in .github/scripts name the team and project with them.
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_HOST: project-buddy-rust.vercel.app
    defaults:
      run:
        # The site's folder, which holds vercel.json, .vercelignore and the
        # drizzle-kit config.
        working-directory: apps/web
    steps:
      # Pin the build and report to the push that started this release.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v5
        with:
          # As the root mise.toml says.
          node-version: 24
          cache: npm

      # Installs the Vercel CLI that apps/web/package.json pins, and
      # drizzle-kit, for every workspace from the root package-lock.json.
      - run: npm ci
        working-directory: .

      # 1. Build on Vercel with the production environment variables, without
      # giving the build the production domain. If this fails, nothing is
      # migrated and production is unchanged.
      - name: Build, not live
        id: build
        # vercel deploy, then up to 20 minutes waiting for READY.
        timeout-minutes: 25
        # From the repository root, not apps/web. The Vercel project's Root
        # Directory is apps/web, and the CLI resolves it against the folder it
        # runs in, so from apps/web it looks for apps/web/apps/web and stops.
        # The root also holds the package-lock.json that the build installs
        # from.
        working-directory: .
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deploy_json="$RUNNER_TEMP/deploy.json"
          status=0
          npx vercel deploy --prod --skip-domain --yes --json \
            --meta "githubCommitSha=$GITHUB_SHA" \
            --meta githubCommitRef=main \
            --token "$VERCEL_TOKEN" > "$deploy_json" || status=$?
          # The CLI prints either the deployment or a status wrapping it.
          url="$(jq -r '(.deployment // .).url // empty' "$deploy_json" 2>/dev/null || true)"
          # Sometimes with a scheme, sometimes without; keep the host.
          url="${url#https://}"
          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "Deployment: $url"
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::vercel deploy failed with status $status"
            exit "$status"
          fi
          if [ -z "$url" ]; then
            echo "::error::vercel deploy printed no deployment URL"
            exit 1
          fi
          inspect_json="$RUNNER_TEMP/inspect.json"
          "$GITHUB_WORKSPACE/.github/scripts/vercel-deployment.sh" "$url" 1200 > "$inspect_json"
          state="$(jq -r '.readyState' "$inspect_json")"
          if [ "$state" != READY ]; then
            echo "::error::The deployment is $state, not READY"
            exit 1
          fi
          echo "id=$(jq -r '.id' "$inspect_json")" >> "$GITHUB_OUTPUT"

      # 2. Migrate while the previous build is still live, which is why
      # migrations only add (docs/project-practices.md, "Data"). If this
      # fails, the new build never goes live.
      - name: Migrate
        id: migrate
        timeout-minutes: 5
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx drizzle-kit migrate

      # 3. Give the new build the production domain, then check that the
      # domain serves it. Promotes through Vercel's REST API, because
      # `vercel promote` answers "User not found" with this token (#239).
      - name: Go live
        id: promote
        # The promote request, then up to 30 checks 10 seconds apart.
        timeout-minutes: 10
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.build.outputs.url }}
          DEPLOYMENT_ID: ${{ steps.build.outputs.id }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/.github/scripts/vercel-promote.sh" "$DEPLOYMENT_ID"
          live_json="$RUNNER_TEMP/live.json"
          # Vercel may answer 202 before the domain moves.
          for attempt in $(seq 1 30); do
            "$GITHUB_WORKSPACE/.github/scripts/vercel-deployment.sh" "$PRODUCTION_HOST" > "$live_json"
            live_id="$(jq -r '.id' "$live_json")"
            if [ "$live_id" = "$DEPLOYMENT_ID" ]; then
              echo "$PRODUCTION_HOST serves $DEPLOYMENT_URL"
              exit 0
            fi
            echo "Attempt $attempt: $PRODUCTION_HOST serves $live_id, not $DEPLOYMENT_ID"
            sleep 10
          done
          echo "::error::$PRODUCTION_HOST does not serve the new deployment"
          exit 1

      # 4. Signed-out requests only: no database writes, no Claude calls.
      - name: Smoke test
        id: smoke
        timeout-minutes: 5
        run: >-
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          scripts/release/smoke.ts "https://$PRODUCTION_HOST"

      # Open an issue for this commit, or comment on the one already open.
      - name: Report the failure
        # Also report a cancelled release.
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD: ${{ steps.build.outcome }}
          MIGRATE: ${{ steps.migrate.outcome }}
          PROMOTE: ${{ steps.promote.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          DEPLOYMENT_URL: ${{ steps.build.outputs.url }}
          DEPLOYMENT_ID: ${{ steps.build.outputs.id }}
        run: |
          set -euo pipefail
          # A step stopped the release if it failed (a step past its own
          # timeout-minutes counts as failed) or was cancelled (the job hit
          # its time limit, or someone cancelled the run).
          stopped() { [ "$1" = failure ] || [ "$1" = cancelled ]; }
          verb_of() { if [ "$1" = cancelled ]; then echo "was cancelled"; else echo failed; fi; }
          if stopped "$BUILD"; then
            verb="$(verb_of "$BUILD")"
            step="1. Build, not live (vercel deploy)"
            state="Production is still on the previous build: nothing was migrated."
          elif stopped "$MIGRATE"; then
            verb="$(verb_of "$MIGRATE")"
            step="2. Migrate (drizzle-kit migrate)"
            state="Production is still on the previous build: the new build never went live. Check whether the migration was applied in part."
          elif stopped "$PROMOTE"; then
            verb="$(verb_of "$PROMOTE")"
            step="3. Go live (promote through Vercel's REST API)"
            state="**Production may be broken.** The database is migrated, but the promotion, or the check that https://$PRODUCTION_HOST serves the new build, failed, so the previous build may be serving the new schema. Someone must promote deployment ${DEPLOYMENT_URL:-unknown} (${DEPLOYMENT_ID:-unknown id}) now, with \`vercel promote ${DEPLOYMENT_URL:-<deployment>} --scope modest-progress\` under a personal login and then the smoke test, or fix forward."
          elif stopped "$SMOKE"; then
            verb="$(verb_of "$SMOKE")"
            step="4. Smoke test"
            state="The new build is live on https://$PRODUCTION_HOST but failed its smoke test."
          else
            verb=failed
            step="Setup (checkout, Node or npm ci)"
            state="Production is still on the previous build: nothing was deployed or migrated."
          fi
          short_sha="${GITHUB_SHA::7}"
          title="Production release failed: $short_sha"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The release of $GITHUB_SHA $verb at step **$step**."
            echo
            echo "$state"
            echo
            echo "A step that ran past its own time limit shows as failed, with \"The action has timed out.\" in the run log."
            echo
            echo "- Commit: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            echo "- Deployment: ${DEPLOYMENT_URL:-none}"
            echo "- Run: $run_url (attempt $GITHUB_RUN_ATTEMPT)"
            echo
            echo "Push a fix to main through a release PR, or rerun this workflow once the cause is fixed. A Vercel rollback restores the code but never the schema."
          } > "$body"
          gh label create ops --color B60205 \
            --description "Production operations" 2>/dev/null || true
          # No skip label: the issue pipeline already ignores issues opened by
          # github-actions[bot], which is not one of its allowed users.
          # Found by title alone, so an issue whose `ops` label was removed
          # still gets the comment instead of a duplicate.
          existing="$(gh issue list --state open \
            --search "\"$title\" in:title" --json number,title \
            | jq -r --arg title "$title" \
              'map(select(.title == $title)) | .[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$body"
            report="#$existing"
          else
            report="$(gh issue create --title "$title" --label ops \
              --body-file "$body")"
          fi
