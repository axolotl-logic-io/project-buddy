# Runs `npm run test:e2e` on each PR and on each push to integration, beside
# the Check workflow: the Vitest browser tests (Chromium and WebKit), then the
# Playwright end-to-end tests against a production build.
#
# It needs no secrets and reaches no outside service but the package, image
# and browser downloads. The job starts the test database from
# apps/web/compose.test-db.yml on the runner, and `npm run test-env:init`
# writes .env.test for it from .env.test.example: a localhost DATABASE_URL,
# the mock model and the email outbox. The test commands refuse any other
# (scripts/test-db/test-database.ts), so the job can't reach the shared Neon
# database, Claude or Resend. Nothing here deploys.
name: Full suite

on:
  pull_request:
  push:
    branches: [integration]

permissions:
  contents: read

# A newer push to a PR cancels that PR's older run, since only its newest
# head can merge. Runs on integration always finish.
concurrency:
  group: full-suite-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/web

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # As the root mise.toml says.
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
        working-directory: .

      # The browsers and the system libraries WebKit needs, which a local
      # machine has and a fresh runner doesn't.
      - run: npx playwright install --with-deps chromium webkit

      - run: npm run test-env:init
      - run: npm run test-db:up
      # Runs the browser tests, resets and migrates the test database, then
      # builds the site and serves it on .env.test's port for the Playwright
      # tests.
      - run: npm run test:e2e

      # The HTML report holds each failed test's trace (playwright.config.ts).
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            !apps/web/test-results/email-outbox/
          retention-days: 14
