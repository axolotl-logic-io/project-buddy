# Runs on each PR and on each push to integration. Each job runs the npm
# script of the same name, so a failure names its stage:
#
# - lint: `npm run lint`, Biome and the type check in every workspace.
# - test: `npm test`, the full suite in every workspace: React Doctor, the
#   script, repository and server tests, the Vitest browser tests (Chromium
#   and WebKit), and the Playwright tests against a production build.
#
# It needs no secrets and reaches no outside service but the package, image
# and browser downloads. The test job starts the test database from
# apps/web/compose.test-db.yml on the runner, and `npm run test-env:init`
# writes .env.test for it from .env.test.example: a localhost DATABASE_URL,
# the mock model and the email outbox. The test commands refuse any other
# (scripts/test-db/test-database.ts), so no job can reach the shared Neon
# database, Claude or Resend. Nothing here deploys. Branch protection on
# integration requires both jobs, and requires a PR's branch to be up to
# date with integration before it merges.
name: CI

on:
  pull_request:
  push:
    branches: [integration]

permissions:
  contents: read

# A newer push to a PR cancels that PR's older run, since only its newest
# head can merge. Runs on integration always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # As the root mise.toml says.
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # As the root mise.toml says.
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The browsers and the system libraries WebKit needs, which a local
      # machine has and a fresh runner doesn't.
      - run: npx playwright install --with-deps chromium webkit
        working-directory: apps/web

      - run: npm run test-env:init --workspace @project-buddy/web
      - run: npm run test-db:up --workspace @project-buddy/web
      # Runs the fast checks, the browser tests and the database lane in
      # parallel. The database lane resets and migrates the test database
      # before the server tests, and again before it builds the site and
      # serves it on .env.test's port for the Playwright tests.
      - run: npm test

      # The HTML report holds each failed test's trace (playwright.config.ts).
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            !apps/web/test-results/email-outbox/
          retention-days: 14
