# Runs on each PR and on each push to integration. Each job runs the mise
# task of the same name, so a failure names its stage:
#
# - lint: `mise run lint`, Biome and the type check in every app.
# - test: `mise run test`, every test in every app: React Doctor, the
#   script, repository and server tests, the Vitest browser tests (Chromium
#   and WebKit), and the Playwright tests against a production build.
#
# It needs no secrets and reaches no outside service but the package, image
# and browser downloads. The test job starts the test database server from
# apps/web/compose.test-db.yml on the runner. Each test suite derives its
# own database on it from the branch, with the mock model and the email
# outbox (apps/web/scripts/test-env/suite-environment.ts), so no job can
# reach the shared Neon database, Claude or Resend. Nothing here deploys.
# Branch protection on integration requires both jobs, and requires a PR's
# branch to be up to date with integration before it merges.
name: CI

on:
  pull_request:
  push:
    branches: [integration]

permissions:
  contents: read

# The checkout's mise.toml files define the tasks, so mise runs them unasked.
env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

# A newer push to a PR cancels that PR's older run, since only its newest
# head can merge. Runs on integration always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Node and the tasks, from the root mise.toml.
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund
      - run: mise run lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5

      # Node and the tasks, from the root mise.toml.
      - uses: jdx/mise-action@v5

      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --no-audit --no-fund

      # The browsers and the system libraries WebKit needs, which a local
      # machine has and a fresh runner doesn't.
      - run: npx playwright install --with-deps chromium webkit
        working-directory: apps/web

      # Only the test server: the tests need no development database.
      - run: docker compose --file compose.test-db.yml up --detach --wait
        working-directory: apps/web
      # Runs the fast checks, the server tests, and the browser and system
      # tests in parallel lanes. The server and system tests each reset and
      # migrate a database of their own first.
      - run: mise run test

      # The HTML report holds each failed test's trace (playwright.config.ts).
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            !apps/web/test-results/email-outbox/
          retention-days: 14
