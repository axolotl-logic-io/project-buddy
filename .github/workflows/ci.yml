# Runs on each PR and on each push to integration. Each job runs
# its own npm script, so a failure names its stage:
#
# - lint: `npm run lint`, Biome and the type check in every workspace.
# - test: `npm run test:core`, React Doctor and every test but the browser and
#   end-to-end tests, in every workspace.
# - test:e2e: `npm run test:e2e`, the Vitest browser tests (Chromium and
#   WebKit), then the Playwright end-to-end tests against a production build.
#
# It needs no secrets and reaches no outside service but the package, image
# and browser downloads. The test and test:e2e jobs start the test database
# from apps/web/compose.test-db.yml on the runner, and `npm run test-env:init`
# writes .env.test for it from .env.test.example: a localhost DATABASE_URL,
# the mock model and the email outbox. The test commands refuse any other
# (scripts/test-db/test-database.ts), so no job can reach the shared Neon
# database, Claude or Resend. Nothing here deploys. Branch protection on
# integration requires all three jobs, and requires a PR's branch to be up to
# date with integration before it merges.
name: CI

on:
  pull_request:
  push:
    branches: [integration]

permissions:
  contents: read

# A newer push to a PR cancels that PR's older run, since only its newest
# head can merge. Runs on integration always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # As the root mise.toml says.
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # As the root mise.toml says.
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run test-env:init --workspace @project-buddy/web
      - run: npm run test-db:up --workspace @project-buddy/web
      # The site's tests reset and migrate the test database first.
      - run: npm run test:core

  test-e2e:
    name: test:e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: 1
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # As the root mise.toml says.
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
        working-directory: .

      # The browsers and the system libraries WebKit needs, which a local
      # machine has and a fresh runner doesn't.
      - run: npx playwright install --with-deps chromium webkit

      - run: npm run test-env:init
      - run: npm run test-db:up
      # Runs the browser tests, resets and migrates the test database, then
      # builds the site and serves it on .env.test's port for the Playwright
      # tests.
      - run: npm run test:e2e

      # The HTML report holds each failed test's trace (playwright.config.ts).
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            !apps/web/test-results/email-outbox/
          retention-days: 14
