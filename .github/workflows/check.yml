# Runs on each PR and on each push to integration: `npm run lint` (Biome and
# the type check in every workspace) and `npm test` (React Doctor and every test
# but the browser and end-to-end tests, in every workspace). It needs no
# secrets. The site's server tests use the test database from
# apps/web/compose.test-db.yml on the runner, and `npm run test-env:init` writes
# .env.test for it from .env.test.example. The Full suite workflow runs
# `npm run test:e2e`. Branch protection on integration requires this job, and
# requires a PR's branch to be up to date with integration before it merges.
name: Check

on:
  pull_request:
  push:
    branches: [integration]

permissions:
  contents: read

# A newer push to a PR cancels that PR's older run, since only its newest
# head can merge. Runs on integration always finish.
concurrency:
  group: check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # As the root mise.toml says.
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test-env:init --workspace @project-buddy/web
      - run: npm run test-db:up --workspace @project-buddy/web
      # The site's tests reset and migrate the test database first.
      - run: npm test
